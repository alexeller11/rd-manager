<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RD Manager IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --ink: #0c0f14;
      --ink-2: #141920;
      --ink-3: #1a2230;
      --surface: #1e2840;
      --surface-2: #243050;
      --line: rgba(255,255,255,0.07);
      --line-2: rgba(255,255,255,0.12);
      --text: #f0f4ff;
      --text-2: #8fa3c8;
      --text-3: #5a6e90;
      --lime: #b8f54a;
      --lime-dim: rgba(184,245,74,0.12);
      --lime-dim2: rgba(184,245,74,0.06);
      --cyan: #4af5d4;
      --cyan-dim: rgba(74,245,212,0.1);
      --amber: #f5c84a;
      --amber-dim: rgba(245,200,74,0.1);
      --rose: #f54a7a;
      --rose-dim: rgba(245,74,122,0.1);
      --blue: #4a8ff5;
      --blue-dim: rgba(74,143,245,0.1);
      --r: 10px;
      --r-lg: 16px;
      --r-xl: 20px;
      --sidebar: 260px;
      --shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--ink);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .app { display: flex; min-height: 100vh; position: relative; z-index: 1; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar);
      background: var(--ink-2);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
      overflow-y: auto;
    }

    .sidebar-inner { padding: 28px 16px 24px; flex: 1; display: flex; flex-direction: column; }

    .brand {
      padding: 0 8px;
      margin-bottom: 32px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .brand-icon {
      width: 36px; height: 36px;
      background: var(--lime);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 14px;
      color: var(--ink);
      letter-spacing: -0.03em;
      flex-shrink: 0;
    }

    .brand-name {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-3);
      padding-left: 46px;
      letter-spacing: 0.02em;
    }

    .nav-section {
      margin-bottom: 4px;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-3);
      padding: 16px 12px 6px;
    }

    .nav-btn {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-2);
      padding: 8px 12px;
      border-radius: var(--r);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 400;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 9px;
      transition: background 0.15s, color 0.15s;
      position: relative;
    }

    .nav-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }

    .nav-btn.active {
      background: var(--lime-dim);
      color: var(--lime);
      font-weight: 500;
    }

    .nav-btn.active::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 3px;
      background: var(--lime);
      border-radius: 0 3px 3px 0;
    }

    .nav-icon {
      width: 16px; height: 16px;
      opacity: 0.7;
      flex-shrink: 0;
    }

    .nav-btn.active .nav-icon { opacity: 1; }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--line);
      margin-top: auto;
    }

    .logout-btn {
      width: 100%;
      background: transparent;
      border: 1px solid var(--line-2);
      color: var(--text-3);
      padding: 8px 12px;
      border-radius: var(--r);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }

    .logout-btn:hover { border-color: var(--rose); color: var(--rose); background: var(--rose-dim); }

    /* ── MAIN ── */
    .main {
      margin-left: var(--sidebar);
      flex: 1;
      padding: 40px 48px;
      min-height: 100vh;
    }

    /* ── PAGE HEADER ── */
    .page-header {
      margin-bottom: 32px;
    }

    .page-eyebrow {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--lime);
      margin-bottom: 8px;
    }

    .page-title {
      font-family: 'Syne', sans-serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .page-sub {
      font-size: 14px;
      color: var(--text-2);
      line-height: 1.5;
    }

    /* ── CARDS ── */
    .card {
      background: var(--ink-2);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 24px;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }

    .card:hover { border-color: var(--line-2); }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }

    /* ── KPI GRID ── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .kpi-card {
      background: var(--ink-2);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 22px 24px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }

    .kpi-card:hover { border-color: var(--line-2); transform: translateY(-1px); }

    .kpi-card::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 80px; height: 80px;
      border-radius: 50%;
      filter: blur(30px);
      opacity: 0.15;
    }

    .kpi-card.lime::after { background: var(--lime); }
    .kpi-card.cyan::after { background: var(--cyan); }
    .kpi-card.amber::after { background: var(--amber); }
    .kpi-card.rose::after { background: var(--rose); }

    .kpi-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-3);
      margin-bottom: 10px;
    }

    .kpi-value {
      font-family: 'Syne', sans-serif;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--text);
      line-height: 1;
    }

    .kpi-change {
      font-size: 12px;
      margin-top: 6px;
      font-weight: 500;
    }

    .kpi-change.up { color: var(--lime); }
    .kpi-change.down { color: var(--rose); }
    .kpi-change.neutral { color: var(--text-3); }

    /* ── BADGES ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .badge.lime { background: var(--lime-dim); color: var(--lime); border: 1px solid rgba(184,245,74,0.2); }
    .badge.cyan { background: var(--cyan-dim); color: var(--cyan); border: 1px solid rgba(74,245,212,0.2); }
    .badge.amber { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(245,200,74,0.2); }
    .badge.rose { background: var(--rose-dim); color: var(--rose); border: 1px solid rgba(245,74,122,0.2); }
    .badge.blue { background: var(--blue-dim); color: var(--blue); border: 1px solid rgba(74,143,245,0.2); }
    .badge.gray { background: rgba(255,255,255,0.06); color: var(--text-2); border: 1px solid var(--line); }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 18px;
      border-radius: var(--r);
      font-family: 'DM Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-primary { background: var(--lime); color: var(--ink); }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }

    .btn-secondary { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--line-2); }
    .btn-secondary:hover:not(:disabled) { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.18); }

    .btn-ghost { background: transparent; color: var(--text-2); border: 1px solid var(--line); }
    .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.04); color: var(--text); }

    .btn-danger { background: var(--rose-dim); color: var(--rose); border: 1px solid rgba(245,74,122,0.2); }
    .btn-danger:hover:not(:disabled) { background: rgba(245,74,122,0.2); }

    .btn-blue { background: var(--blue); color: #fff; }
    .btn-blue:hover:not(:disabled) { filter: brightness(1.1); }

    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-sm { padding: 6px 12px; font-size: 12px; }

    /* ── FORMS ── */
    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-2);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    input, textarea, select {
      width: 100%;
      max-width: 480px;
      padding: 10px 14px;
      background: var(--ink);
      border: 1px solid var(--line-2);
      border-radius: var(--r);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-appearance: none;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--lime);
      box-shadow: 0 0 0 3px var(--lime-dim2);
    }

    textarea { resize: vertical; min-height: 80px; }

    select option { background: var(--ink-2); }

    /* ── ALERTS ── */
    .alert {
      padding: 14px 18px;
      border-radius: var(--r);
      font-size: 13.5px;
      font-weight: 500;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .alert-error { background: var(--rose-dim); border: 1px solid rgba(245,74,122,0.25); color: #ffb3c8; }
    .alert-success { background: var(--lime-dim); border: 1px solid rgba(184,245,74,0.25); color: var(--lime); }
    .alert-info { background: var(--blue-dim); border: 1px solid rgba(74,143,245,0.25); color: #9dc8ff; }

    /* ── CLIENT CARD ── */
    .client-item {
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 20px 24px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: border-color 0.2s, background 0.2s;
    }

    .client-item:hover { border-color: var(--line-2); background: var(--ink-2); }

    .client-avatar {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--lime-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--lime);
      flex-shrink: 0;
    }

    .client-info { flex: 1; min-width: 0; }

    .client-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .client-meta {
      font-size: 12px;
      color: var(--text-3);
    }

    .client-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

    /* ── AI RESULT ── */
    .ai-result {
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 28px;
      font-size: 14px;
      line-height: 1.75;
      color: var(--text-2);
    }

    .ai-result h1, .ai-result h2, .ai-result h3 {
      font-family: 'Syne', sans-serif;
      color: var(--text);
      margin: 24px 0 10px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .ai-result h1 { font-size: 22px; margin-top: 0; }
    .ai-result h2 { font-size: 17px; color: var(--lime); }
    .ai-result h3 { font-size: 15px; }

    .ai-result p { margin-bottom: 12px; }

    .ai-result ul, .ai-result ol {
      padding-left: 20px;
      margin-bottom: 12px;
    }

    .ai-result li { margin-bottom: 6px; }

    .ai-result strong { color: var(--text); font-weight: 600; }

    .ai-result code {
      background: rgba(184,245,74,0.1);
      color: var(--lime);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }

    .ai-result hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: 20px 0;
    }

    /* ── MODULE ITEMS ── */
    .module-item {
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 14px 18px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13.5px;
      transition: border-color 0.15s;
    }

    .module-item:hover { border-color: var(--line-2); }

    .module-item-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .module-item-info { flex: 1; min-width: 0; }

    .module-item-name {
      font-weight: 500;
      color: var(--text);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .module-item-meta { font-size: 12px; color: var(--text-3); }

    /* ── DATA TABLE ── */
    .data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }

    .data-table th {
      text-align: left;
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-3);
      border-bottom: 1px solid var(--line);
    }

    .data-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      color: var(--text-2);
    }

    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: rgba(255,255,255,0.02); color: var(--text); }

    /* ── SCORE BAR ── */
    .score-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 99px;
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
    }

    /* ── HEALTH RING ── */
    .health-ring {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .health-score-num {
      font-family: 'Syne', sans-serif;
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
    }

    /* ── SPINNER ── */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: var(--lime);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── EMPTY STATE ── */
    .empty {
      text-align: center;
      padding: 60px 40px;
      color: var(--text-3);
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    .empty-title {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 8px;
    }

    .empty p { font-size: 13.5px; max-width: 320px; margin: 0 auto; }

    /* ── GRID LAYOUTS ── */
    .two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
    .three-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

    /* ── LOGIN ── */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      background: var(--ink-2);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 48px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
    }

    .login-logo-icon {
      width: 48px; height: 48px;
      background: var(--lime);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 18px;
      color: var(--ink);
    }

    .login-logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .login-card h2 {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .login-card p {
      font-size: 14px;
      color: var(--text-2);
      margin-bottom: 28px;
    }

    .login-card input { max-width: 100%; margin-bottom: 12px; }

    /* ── STATS WIDGET ── */
    .stat-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .stat-row:last-child { border-bottom: none; }

    .stat-label { flex: 1; font-size: 13.5px; color: var(--text-2); }

    .stat-value { font-weight: 600; font-size: 14px; color: var(--text); }

    .stat-bar { width: 80px; }

    /* ── PILL TABS ── */
    .pill-tabs {
      display: flex;
      gap: 6px;
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: 99px;
      padding: 4px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .pill-tab {
      background: transparent;
      border: none;
      padding: 7px 16px;
      border-radius: 99px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-3);
      transition: all 0.15s;
    }

    .pill-tab.active { background: var(--lime); color: var(--ink); font-weight: 600; }
    .pill-tab:not(.active):hover { color: var(--text); background: rgba(255,255,255,0.05); }

    /* ── SCROLLABLE LIST ── */
    .scroll-list { max-height: 400px; overflow-y: auto; }

    .scroll-list::-webkit-scrollbar { width: 4px; }
    .scroll-list::-webkit-scrollbar-track { background: transparent; }

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;
const API = "";
const BUILD = "2026-04-18-v2.0-redesign";

/* ── AUTH ── */
const getToken = () => { try { return localStorage.getItem("rdm_token"); } catch { return null; } };
const setToken = (t) => { try { localStorage.setItem("rdm_token", t); } catch {} };
const clearToken = () => { try { localStorage.removeItem("rdm_token"); } catch {} };

async function api(url, opts = {}) {
  const token = getToken();
  const headers = {
    ...(opts.body ? { "Content-Type": "application/json" } : {}),
    ...(token ? { Authorization: `Bearer ${token}` } : {}),
    ...(opts.headers || {}),
  };
  const res = await fetch(API + url, { ...opts, headers });
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) {
    if (res.status === 401) clearToken();
    throw new Error((data?.detail) || String(data) || "Erro do servidor");
  }
  return data;
}

/* ── SIMPLE MARKDOWN ── */
function renderMd(text) {
  if (!text) return "";
  return text
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^#### (.+)$/gm, '<strong>$1</strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^---$/gm, '<hr/>')
    .replace(/^[\-\*] (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/^(?!<[hup]|<li|<hr)(.+)$/gm, '<p>$1</p>');
}

  logout: <svg style={{width:14,height:14}} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M6 2H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3M10 11l4-4-4-4M14 8H6"/></svg>,

  connect: <svg style={{width:14,height:14}} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M6 10l1.5 1.5L10 9"/><rect x="1" y="1" width="14" height="14" rx="3"/></svg>,
  add: <svg style={{width:14,height:14}} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M8 3v10M3 8h10"/></svg>,

  ai: <svg style={{width:14,height:14}} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M13 3l-1.4 1.4M4.4 11.6 3 13"/></svg>,
  copy: <svg style={{width:14,height:14}} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="4" y="4" width="9" height="11" rx="1.5"/><path d="M4 4V3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h1"/></svg>,
};

/* ── COMPONENTS ── */

function Spinner({ size = 16 }) {
  return <div className="spinner" style={{width:size,height:size}} />;
}

function Alert({ type="error", children }) {
  return <div className={`alert alert-${type}`}>{children}</div>;
}

function CopyBtn({ text }) {
  const [copied, setCopied] = useState(false);
  function copy() {
    navigator.clipboard?.writeText(text).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    });
  }
  return (
    <button className="btn btn-ghost btn-sm" onClick={copy}>
      {icons.copy} {copied ? "Copiado!" : "Copiar"}
    </button>
  );
}

function AiResultBlock({ result }) {
  if (!result) return null;
  return (
    <div>
      <div className="row-between" style={{marginBottom:12}}>
        <span style={{fontSize:12,color:"var(--text-3)"}}>Resultado da IA</span>
        <CopyBtn text={result} />
      </div>
      <div className="ai-result md" dangerouslySetInnerHTML={{__html: renderMd(result)}} />
    </div>
  );
}

function ScoreDisplay({ score, label, size = "md" }) {
  const color = score >= 75 ? "var(--lime)" : score >= 50 ? "var(--amber)" : "var(--rose)";
  const fs = size === "lg" ? 52 : 32;
  return (
    <div style={{display:"flex",alignItems:"baseline",gap:8}}>
      <span style={{fontFamily:"Syne,sans-serif",fontSize:fs,fontWeight:800,color,letterSpacing:"-0.04em",lineHeight:1}}>{score}</span>
      {label && <span style={{fontSize:13,color:"var(--text-3)"}}>{label}</span>}
    </div>
  );
}

function BarMetric({ label, value, max=100, color="var(--lime)" }) {
  const pct = Math.min(100, Math.round((value/max)*100));
  return (
    <div style={{marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
        <span style={{fontSize:12,color:"var(--text-3)"}}>{label}</span>
        <span style={{fontSize:12,fontWeight:600,color:"var(--text)"}}>{value}</span>
      </div>
      <div className="score-bar">
        <div className="score-bar-fill" style={{width:`${pct}%`,background:color}} />
      </div>
    </div>
  );
}

function ClientSelect({ value, onChange, clients }) {

/* ── LOGIN ── */
function LoginPage({ onLogin }) {
  const [user, setUser] = useState("admin");
  const [pass, setPass] = useState("");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  async function submit(e) {
    e.preventDefault();
    setLoading(true); setErr("");
    try {
      const body = new URLSearchParams({ username: user, password: pass });
      const res = await fetch(API + "/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body.toString(),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data?.detail || "Falha no login");
      setToken(data.access_token);
      onLogin();
    } catch (e) { setErr(e.message); }
    finally { setLoading(false); }
  }

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-logo">
          <div className="login-logo-icon">RD</div>
          <span className="login-logo-text">RD Manager IA</span>
        </div>
        <h2>Bem-vindo de volta</h2>
        <p>Acesse sua conta para gerenciar sua agência.</p>
        {err && <Alert type="error">{err}</Alert>}
        <form onSubmit={submit}>
          <div className="field">
            <label>Usuário</label>
            <input value={user} onChange={e=>setUser(e.target.value)} placeholder="admin" autoFocus />
          </div>
          <div className="field">
            <label>Senha</label>
            <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" />
          </div>
          <button type="submit" className="btn btn-primary" style={{width:"100%",justifyContent:"center",marginTop:8}} disabled={loading}>
            {loading ? <><Spinner/> Entrando...</> : "Entrar"}
          </button>
        </form>
      </div>
    </div>
  );
}

/* ── DASHBOARD ── */
function Dashboard() {
  const [stats, setStats] = useState(null);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");
  const [overview, setOverview] = useState(null);

  useEffect(() => {
    Promise.all([
      api("/api/agency/stats").catch(e => null),
      api("/api/agency/overview").catch(e => null),
    ]).then(([s, o]) => { setStats(s); setOverview(o); setLoading(false); })
      .catch(e => { setErr(e.message); setLoading(false); });
  }, []);

  if (loading) return <div style={{padding:80,textAlign:"center"}}><Spinner size={32}/></div>;

  const s = stats || {};
  const o = overview || {};
  const totals = o.totals || {};
  const ranking = o.ranking || [];
  const alerts = o.alerts || [];

  return (
    <div>
      <div className="page-header">
        <div className="page-eyebrow">Visão Geral</div>
        <h1 className="page-title">Dashboard da Agência</h1>
        <p className="page-sub">Métricas consolidadas de todos os clientes gerenciados.</p>
      </div>

      {err && <Alert type="error">{err}</Alert>}

      <div className="kpi-grid">
        <div className="kpi-card lime">
          <div className="kpi-label">Clientes ativos</div>
          <div className="kpi-value">{s.total_clients ?? totals.total_clients ?? "—"}</div>
          <div className="kpi-change neutral">{s.synced_clients ?? 0} com sync</div>
        </div>
        <div className="kpi-card cyan">
          <div className="kpi-label">Total de leads</div>
          <div className="kpi-value">{(s.total_leads ?? totals.total_leads ?? 0).toLocaleString("pt-BR")}</div>
          <div className="kpi-change neutral">Monitorados ativos</div>
        </div>
        <div className="kpi-card amber">
          <div className="kpi-label">Score médio</div>
          <div className="kpi-value">{Math.round(s.avg_health_score ?? totals.avg_health_score ?? 0)}<span style={{fontSize:18,opacity:0.5}}>/100</span></div>
          <div className="kpi-change neutral">Saúde da carteira</div>
        </div>
        <div className="kpi-card rose">
          <div className="kpi-label">Clientes críticos</div>
          <div className="kpi-value" style={{color:"var(--rose)"}}>{s.critical_clients ?? alerts.length ?? 0}</div>
          <div className="kpi-change down">Precisam de atenção</div>
        </div>
      </div>

      <div className="two-col">
        <div className="card">
          <div className="card-title">Ranking de Clientes</div>
          {ranking.length === 0 ? (
            <div className="empty"><div className="empty-icon">📊</div><div className="empty-title">Sem dados</div><p>Sincronize clientes para ver o ranking.</p></div>
          ) : ranking.slice(0,8).map((c,i) => {
            const color = c.health_score >= 75 ? "var(--lime)" : c.health_score >= 50 ? "var(--amber)" : "var(--rose)";
            return (
              <div key={c.client_id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderBottom:"1px solid var(--line)"}}>
                <span style={{fontSize:11,color:"var(--text-3)",width:20,textAlign:"right"}}>{i+1}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:13.5,fontWeight:600,color:"var(--text)",marginBottom:4}}>{c.name}</div>
                  <BarMetric label="" value={c.health_score} color={color} />
                </div>
                <span style={{fontSize:13,fontWeight:700,color,width:40,textAlign:"right"}}>{c.health_score}</span>
              </div>
            );
          })}
        </div>

        <div className="card">
          <div className="card-title">Métricas da Carteira</div>
          <div>
            {[
              ["Taxa de abertura média", `${totals.avg_open_rate ?? 0}%`],
              ["Taxa de clique média", `${totals.avg_click_rate ?? 0}%`],
              ["Total de campanhas", totals.total_campaigns ?? 0],
              ["Total de conversões", totals.total_conversions ?? 0],

                <span className="stat-label">{l}</span>
                <span className="stat-value">{v}</span>

          {alerts.length > 0 && (
            <div style={{marginTop:20}}>
              <div style={{fontSize:12,fontWeight:600,color:"var(--rose)",marginBottom:10,textTransform:"uppercase",letterSpacing:"0.08em"}}>⚠ Clientes em alerta</div>
              {alerts.slice(0,4).map(a => (
                <div key={a.client_id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:"var(--rose-dim)",borderRadius:8,marginBottom:6,border:"1px solid rgba(245,74,122,0.15)"}}>
                  <span style={{fontSize:13.5,color:"var(--rose)",fontWeight:600}}>{a.name}</span>
                  <span className="badge rose" style={{marginLeft:"auto"}}>score {a.health_score}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );

/* ── CLIENTS ── */
function ClientsPanel() {
  const [clients, setClients] = useState([]);
  const [loading, setLoading] = useState(false);
  const [saving, setSaving] = useState(false);
  const [syncingId, setSyncingId] = useState(null);
  const [err, setErr] = useState("");
  const [ok, setOk] = useState("");
  const [form, setForm] = useState({ name:"", segment:"", website:"", description:"" });
  const [showForm, setShowForm] = useState(false);

  const load = useCallback(async () => {
    setLoading(true); setErr("");
    try { setClients(await api("/api/clients/") || []); }
    catch(e) { setErr(e.message); }
    finally { setLoading(false); }
  }, []);

  useEffect(() => { load(); }, [load]);

  async function create(e) {
    e.preventDefault();
    if (!form.name.trim()) { setErr("Informe o nome."); return; }
    setSaving(true); setErr(""); setOk("");
    try {
      await api("/api/clients/", { method:"POST", body: JSON.stringify(form) });
      setForm({ name:"", segment:"", website:"", description:"" });
      setOk("Cliente adicionado!"); setShowForm(false);
      await load();
    } catch(e) { setErr(e.message); }
    finally { setSaving(false); }
  }

  async function sync(id) {
    setSyncingId(id); setErr(""); setOk("");
    try { await api(`/api/rdsync/run/${id}`, { method:"POST" }); setOk("Sync executado!"); await load(); }
    catch(e) { setErr(e.message); }
    finally { setSyncingId(null); }
  }

  const initials = (name) => name?.split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase() || "??";

  return (
    <div>
      <div className="page-header">
        <div className="page-eyebrow">Gestão</div>
        <h1 className="page-title">Clientes</h1>
        <p className="page-sub">Cadastre, conecte ao RD Station e sincronize dados da sua carteira.</p>

      {err && <Alert type="error">{err}</Alert>}
      {ok && <Alert type="success">{ok}</Alert>}

      <div className="row-between" style={{marginBottom:20}}>
        <div className="row">
          <button className="btn btn-primary" onClick={()=>setShowForm(!showForm)}>
            {icons.add} Novo cliente
          </button>
          <button className="btn btn-secondary" onClick={load} disabled={loading}>
            {loading ? <Spinner/> : icons.refresh} Atualizar
          </button>
        </div>
        <span style={{fontSize:13,color:"var(--text-3)"}}>{clients.length} cliente{clients.length!==1?"s":""}</span>
      </div>

      {showForm && (
        <div className="card" style={{marginBottom:24,borderColor:"rgba(184,245,74,0.2)"}}>
          <div className="card-title">{icons.add} Adicionar novo cliente</div>
          <form onSubmit={create}>
            <div className="two-col">
              <div>
                <div className="field"><label>Nome *</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Ex: Empresa XYZ" autoFocus /></div>
                <div className="field"><label>Segmento</label><select value={form.segment} onChange={e=>setForm({...form,segment:e.target.value})}>
                  <option value="">Selecione...</option>
                  {["E-commerce","SaaS","Serviços","Educação","Saúde","Varejo","Indústria","Outro"].map(s=><option key={s}>{s}</option>)}
                </select></div>
              </div>

/* ── MODULE PAGE (generic) ── */
function ModulePage({ title, eyebrow, description, endpoint, renderItem }) {
  const [clients, setClients] = useState([]);
  const [clientId, setClientId] = useState("");
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  useEffect(() => {
    api("/api/clients/").then(res => {
      const list = Array.isArray(res) ? res : [];
      setClients(list);
      if (list.length > 0) setClientId(String(list[0].id));
    }).catch(e => setErr(e.message));
  }, []);

  async function load() {
    if (!clientId) return;
    setLoading(true); setErr(""); setData(null);
    try { setData(await api(endpoint.replace("{id}", clientId))); }
    catch(e) { setErr(e.message); }
    finally { setLoading(false); }
  }

  const items = data?.data?.items || data?.items || [];

  return (
    <div>
      <div className="page-header">
        <div className="page-eyebrow">{eyebrow}</div>
        <h1 className="page-title">{title}</h1>
        <p className="page-sub">{description}</p>
      </div>
      {err && <Alert>{err}</Alert>}

      <div className="card">
        <div className="row">
          <ClientSelect value={clientId} onChange={setClientId} clients={clients} />
          <button className="btn btn-primary" onClick={load} disabled={!clientId||loading}>
            {loading ? <><Spinner/>Carregando...</> : "Carregar dados"}
          </button>
        </div>
      </div>

      {data && (
        <div className="card">
          <div className="row-between" style={{marginBottom:16}}>
            <div className="card-title" style={{margin:0}}>
              {items.length} {title.toLowerCase()} encontrado{items.length!==1?"s":""}
            </div>
            <span className="badge lime">sincronizado</span>
          </div>

          {items.length === 0 ? (
            <div className="empty"><div className="empty-title">Nenhum dado disponível</div><p>Sincronize o cliente primeiro para carregar os dados.</p></div>
          ) : (
            <div className="scroll-list">
              {items.map((item, i) => renderItem ? renderItem(item, i) : (
                <div key={i} className="module-item">
                  <div className="module-item-info">
                    <div className="module-item-name">{item?.payload?.name || item?.payload?.title || item?.payload?.email || item?.object_key || `Item ${i+1}`}</div>
                    <div className="module-item-meta">{item?.synced_at ? `Sincronizado: ${new Date(item.synced_at).toLocaleDateString("pt-BR")}` : ""}</div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ── FLOW STUDIO ── */
function FlowStudio() {
  const [clients, setClients] = useState([]);
  const [clientId, setClientId] = useState("");
  const [tab, setTab] = useState("flow");
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [err, setErr] = useState("");
  const [form, setForm] = useState({
    goal:"", flow_type:"nutricao", flow_days:14, email_count:5,
    product:"", audience:"", awareness:"consciência do problema",
    // email fields
    tone:"consultivo", objective:"gerar resposta", theme:"nutrição", cta:"saiba mais", target:"leads da base",
  });

  useEffect(() => {
    api("/api/clients/").then(res => {
      const l = Array.isArray(res)?res:[];
      setClients(l);
      if (l.length) setClientId(String(l[0].id));
    });
  }, []);

  async function generate() {
    setLoading(true); setErr(""); setResult(null);
    try {
      const client = clients.find(c=>String(c.id)===clientId);
      const body = tab==="flow" ? {
        ...form,
        client_name: client?.name||"",
        client_segment: client?.segment||"",
        client_description: client?.description||"",
      } : {
        tone: form.tone, objective: form.objective, theme: form.theme,
        cta: form.cta, target: form.target,
        client_name: client?.name||"",
        product: form.product,
      };
      const url = tab==="flow" ? "/api/flows-advanced/generate-flow" : "/api/flows-advanced/generate-email";
      setResult(await api(url, { method:"POST", body: JSON.stringify(body) }));
    } catch(e) { setErr(e.message); }
    finally { setLoading(false); }
  }

  const flow = result?.flow;
  const email = result?.email;

  return (
    <div>
      <div className="page-header">
        <div className="page-eyebrow">IA Generativa</div>
        <h1 className="page-title">Flow Studio IA</h1>

          <button key={k} className={`pill-tab ${tab===k?"active":""}`} onClick={()=>{setTab(k);setResult(null);setErr("");}}>
            {l}

            <div className="field"><label>Objetivo do fluxo</label><input value={form.goal} onChange={e=>setForm({...form,goal:e.target.value})} placeholder="Ex: nutrir leads capturados via webinar" /></div>
            <div className="field"><label>Tipo de fluxo</label><select value={form.flow_type} onChange={e=>setForm({...form,flow_type:e.target.value})}>
              {[["nutricao","Nutrição"],["boas-vindas","Boas-vindas"],["reengajamento","Reengajamento"],["pos-venda","Pós-venda"],["onboarding","Onboarding"]].map(([v,l]) => <option key={v} value={v}>{l}</option>)}
            </select></div>
            <div className="field"><label>Produto/Serviço</label><input value={form.product} onChange={e=>setForm({...form,product:e.target.value})} placeholder="Ex: Curso de marketing digital" /></div>
            <div className="field"><label>Público-alvo</label><input value={form.audience} onChange={e=>setForm({...form,audience:e.target.value})} placeholder="Ex: Empreendedores B2B" /></div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>

                <div className="ai-result md" style={{fontSize:12}} dangerouslySetInnerHTML={{__html:renderMd(ver.body)}} />
                <div style={{marginTop:8,display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:12,color:"var(--text-3)"}}>CTA:</span>
                  <span className="badge lime">{ver.cta_text}</span>
                </div>
              </div>
            ) : null)}
            {email.reasoning && <p style={{fontSize:12.5,color:"var(--text-3)",marginTop:8,lineHeight:1.6}}>💡 {email.reasoning}</p>}
          </>}
        </div>
      </div>
    </div>
  );
}

/* ── HEALTH AUDIT ── */
function HealthAudit() {
  const [clients, setClients] = useState([]);
  const [clientId, setClientId] = useState("");
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  useEffect(() => {
    api("/api/clients/").then(res => {
      const l=Array.isArray(res)?res:[];
      setClients(l);
      if(l.length) setClientId(String(l[0].id));
    });
  },[]);

  async function load() {
    setLoading(true);setErr("");setData(null);
    try { setData(await api(`/api/health-audit/client/${clientId}?ai=true`)); }
    catch(e) { setErr(e.message); }
    finally { setLoading(false); }
  }

  const d = data?.data;

  return (
    <div>
      <div className="page-header">
        <div className="page-eyebrow">Diagnóstico</div>
        <h1 className="page-title">Auditoria de Saúde</h1>
        <p className="page-sub">Diagnóstico completo da conta RD Station com análise de workflows, leads e landing pages.</p>
      </div>
      {err && <Alert>{err}</Alert>}

      <div className="card">
        <div className="row">
          <ClientSelect value={clientId} onChange={setClientId} clients={clients} />
          <button className="btn btn-primary" onClick={load} disabled={!clientId||loading}>
            {loading ? <><Spinner/>Auditando...</> : <>{icons.health} Gerar auditoria</>}
          </button>
        </div>
      </div>

      {loading && <div style={{padding:80,textAlign:"center"}}><Spinner size={28}/><p style={{marginTop:16,color:"var(--text-3)"}}>Analisando conta...</p></div>}

      {d && (
        <div>
          <div className="kpi-grid">
            {[
              ["Score Geral", d.overall_score, d.health_label?.replace(/[✅⚠️🔴]/g,"").trim() || "", d.overall_score>=75?"lime":d.overall_score>=45?"amber":"rose"],
              ["Workflows", d.workflows?.active||0, `${d.workflows?.total||0} total`, "cyan"],
              ["Leads quentes", d.leads?.hot||0, `${d.leads?.engagement_rate||0}% engaj.`, "lime"],
              ["LPs top", d.landing_pages?.top||0, `${d.landing_pages?.critical||0} críticas`, "amber"],
            ].map(([l,v,sub,c]) => (
              <div key={l} className={`kpi-card ${c}`}>
                <div className="kpi-label">{l}</div>
                <div className="kpi-value">{v}</div>
                {sub && <div className="kpi-change neutral">{sub}</div>}
              </div>
            ))}
          </div>

          <div className="two-col">
            <div className="card">
              <div className="card-title">Diagnóstico por Módulo</div>
              {[
                ["Workflows", d.workflows?.score||0, d.workflows?.issues||[]],
                ["Leads", d.leads?.score||0, d.leads?.issues||[]],
                ["Landing Pages", d.landing_pages?.score||0, d.landing_pages?.issues||[]],
              ].map(([l,s,issues]) => (
                <div key={l} style={{marginBottom:20}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                    <span style={{fontSize:13.5,fontWeight:600,color:"var(--text)"}}>{l}</span>
                    <span style={{fontFamily:"Syne",fontSize:18,fontWeight:700,color:s>=75?"var(--lime)":s>=50?"var(--amber)":"var(--rose)"}}>{s}</span>
                  </div>
                  <BarMetric label="" value={s} color={s>=75?"var(--lime)":s>=50?"var(--amber)":"var(--rose)"} />
                  {issues.map((issue,i) => (
                    <div key={i} style={{fontSize:12,color:"var(--rose)",padding:"6px 10px",background:"var(--rose-dim)",borderRadius:6,marginTop:4}}>⚠ {issue}</div>
                  ))}
                </div>
              ))}
            </div>

            <div className="card">
              <div className="card-title">Análise IA</div>
              {d.ai_commentary ? (
                <div>
                  {d.ai_commentary.summary && <p style={{fontSize:14,color:"var(--text-2)",lineHeight:1.7,marginBottom:16}}>{d.ai_commentary.summary}</p>}
                  {(d.ai_commentary.actions||[]).slice(0,4).map((a,i) => (
                    <div key={i} style={{display:"flex",gap:10,padding:"10px 12px",background:"var(--ink)",borderRadius:8,marginBottom:8,border:"1px solid var(--line)"}}>
                      <span style={{color:"var(--lime)",fontWeight:700,fontSize:12,flexShrink:0}}>#{i+1}</span>
                      <div>
                        <div style={{fontSize:13.5,fontWeight:600,color:"var(--text)"}}>{a.action}</div>
                        <div style={{display:"flex",gap:6,marginTop:4}}>
                          <span className="badge gray">{a.area}</span>
                          <span className={`badge ${a.effort==="baixo"?"lime":a.effort==="medio"?"amber":"rose"}`}>{a.effort}</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              ) : <div className="empty"><p>Auditoria sem comentário de IA. Tente novamente com ai=true.</p></div>}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── PROSPECT ── */
function Prospect() {
  const [form, setForm] = useState({ company_name:"", niche:"", city:"", website:"", instagram:"" });
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  async function analyze() {
    setLoading(true);setErr("");setResult(null);
    try { setResult(await api("/api/prospect/analyze-business",{method:"POST",body:JSON.stringify(form)})); }
    catch(e) { setErr(e.message); }
    finally { setLoading(false); }
  }

  const d = result?.analysis;

  return (
    <div>
      <div className="page-header">
        <div className="page-eyebrow">Comercial</div>
        <h1 className="page-title">Diagnóstico de Prospecção</h1>
        <p className="page-sub">Analise um prospect e gere diagnóstico comercial completo com abordagem personalizada.</p>
      </div>
      {err && <Alert>{err}</Alert>}

      <div className="two-col">
        <div className="card">
          <div className="card-title">Dados da empresa</div>
          {[["company_name","Nome da empresa","Ex: TechSoft Ltda"],["niche","Nicho/segmento","Ex: Software B2B"],["city","Cidade","Ex: São Paulo"],["website","Website","https://..."],["instagram","Instagram","@handle"]].map(([k,l,p]) => (
            <div key={k} className="field">
              <label>{l}</label>
              <input value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} placeholder={p} />
            </div>
          ))}
          <button className="btn btn-primary" onClick={analyze} disabled={loading} style={{width:"100%",justifyContent:"center"}}>
            {loading ? <><Spinner/>Analisando...</> : <>{icons.ai} Gerar diagnóstico</>}
          </button>
        </div>

        <div className="card">
          {!d && !loading && <div className="empty"><div className="empty-icon">🎯</div><div className="empty-title">Pronto para prospectar</div><p>Preencha os dados e gere um diagnóstico comercial personalizado.</p></div>}
          {loading && <div style={{padding:60,textAlign:"center"}}><Spinner size={28}/></div>}
          {d && (
            <div>
              <div className="row-between" style={{marginBottom:16}}>
                <div className="card-title" style={{margin:0}}>{d.company_name || "Empresa"}</div>
                <span className={`badge ${d.potential?.includes("Alto")?"lime":"amber"}`}>Potencial {d.potential}</span>
              </div>
              <p style={{fontSize:14,color:"var(--text-2)",lineHeight:1.7,marginBottom:20}}>{d.executive_summary}</p>

              {[["⚠ Pontos fracos","rose",d.weak_points],["✅ Oportunidades","lime",d.opportunities],["💬 Ângulos de venda","cyan",d.sales_angles],["🗓 Plano de ação","amber",d.action_plan]].map(([title,c,items]) => items?.length ? (
                <div key={title} style={{marginBottom:16}}>
                  <div style={{fontSize:12,fontWeight:600,color:`var(--${c})`,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>{title}</div>
                  {items.map((item,i) => <div key={i} style={{fontSize:13,color:"var(--text-2)",padding:"7px 10px",background:"var(--ink)",borderRadius:8,marginBottom:4,lineHeight:1.5}}>{item}</div>)}
                </div>
              ) : null)}

              {d.proposal && (
                <div style={{padding:16,background:"var(--lime-dim2)",borderRadius:"10px",border:"1px solid rgba(184,245,74,0.15)",marginTop:12}}>
                  <div style={{fontSize:11,fontWeight:600,color:"var(--lime)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>Proposta sugerida</div>
                  <p style={{fontSize:13,color:"var(--text-2)",marginBottom:8}}>{d.proposal.pitch}</p>
                  {(d.proposal.entregas||[]).map((e,i) => <div key={i} style={{fontSize:12,color:"var(--lime)",padding:"4px 0"}}>→ {e}</div>)}
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── EXECUTIVE REPORT ── */
function ExecutiveReport() {
  const [clients, setClients] = useState([]);
  const [clientId, setClientId] = useState("");
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  useEffect(() => {
    api("/api/clients/").then(res => {
      const l=Array.isArray(res)?res:[];
      setClients(l);
      if(l.length) setClientId(String(l[0].id));
    });
  },[]);

  async function load() {
    setLoading(true);setErr("");setData(null);
    try { setData(await api(`/api/executive-report/client/${clientId}`)); }
    catch(e) { setErr(e.message); }
    finally { setLoading(false); }
  }

  const r = data?.report;

  return (
    <div>
      <div className="page-header">
        <div className="page-eyebrow">Relatórios</div>
        <h1 className="page-title">Relatório Executivo</h1>
        <p className="page-sub">Relatório estratégico completo com score, diagnóstico e próximos passos por cliente.</p>
      </div>
      {err && <Alert>{err}</Alert>}

      <div className="card">
        <div className="row">
          <ClientSelect value={clientId} onChange={setClientId} clients={clients} />
          <button className="btn btn-primary" onClick={load} disabled={!clientId||loading}>
            {loading ? <><Spinner/>Gerando...</> : <>{icons.report} Gerar relatório</>}
          </button>
        </div>
      </div>

      {r && (
        <div>
          <div className="kpi-grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))"}}>
            <div className={`kpi-card ${r.score_data?.score>=75?"lime":r.score_data?.score>=50?"amber":"rose"}`}>
              <div className="kpi-label">Score</div>
              <div className="kpi-value">{r.score_data?.score||0}<span style={{fontSize:16,opacity:0.5}}>/100</span></div>
              <div className="kpi-change neutral">{r.score_data?.priority||""}</div>
            </div>
            {Object.entries(r.score_data?.counts||{}).map(([k,v]) => (
              <div key={k} className="kpi-card">
                <div className="kpi-label">{k.replace(/_/g," ")}</div>
                <div className="kpi-value">{v}</div>
              </div>
            ))}
          </div>

          <div className="two-col">
            <div className="card">
              <div className="card-title">Diagnóstico Estratégico</div>
              <p style={{fontSize:14,color:"var(--text-2)",lineHeight:1.7,marginBottom:16}}>{r.executive_resume}</p>
              {(r.strategic_diagnosis||[]).map((d,i) => (
                <div key={i} style={{display:"flex",gap:10,padding:"8px 0",borderBottom:"1px solid var(--line)"}}>
                  <span style={{color:"var(--lime)",flexShrink:0}}>→</span>
                  <span style={{fontSize:13.5,color:"var(--text-2)"}}>{d}</span>
                </div>
              ))}
            </div>

            <div className="card">
              <div className="card-title">Próximos Passos</div>
              {(r.next_steps||[]).map((s,i) => (
                <div key={i} style={{display:"flex",gap:10,padding:"10px 12px",background:"var(--ink)",borderRadius:8,marginBottom:8}}>
                  <span style={{fontFamily:"Syne",fontWeight:800,color:"var(--lime)",fontSize:14,flexShrink:0}}>{i+1}</span>
                  <span style={{fontSize:13.5,color:"var(--text-2)"}}>{s}</span>
                </div>
              ))}

              {(r.risk_flags||[]).length > 0 && (
                <div style={{marginTop:16}}>
                  <div style={{fontSize:11,fontWeight:600,color:"var(--rose)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>Riscos identificados</div>
                  {r.risk_flags.map((f,i) => <div key={i} style={{fontSize:12.5,color:"var(--rose)",padding:"6px 10px",background:"var(--rose-dim)",borderRadius:6,marginBottom:4}}>⚠ {f}</div>)}
                </div>
              )}

              {(r.opportunity_flags||[]).length > 0 && (
                <div style={{marginTop:12}}>
                  <div style={{fontSize:11,fontWeight:600,color:"var(--lime)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>Oportunidades</div>
                  {r.opportunity_flags.map((f,i) => <div key={i} style={{fontSize:12.5,color:"var(--lime)",padding:"6px 10px",background:"var(--lime-dim2)",borderRadius:6,marginBottom:4}}>✓ {f}</div>)}
                </div>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── ALERTS ── */
function AlertsPanel() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");

  useEffect(() => {
    api("/api/alerts/agency")
      .then(d => { setData(d); setLoading(false); })
      .catch(e => { setErr(e.message); setLoading(false); });
  },[]);

  const d = data?.alerts || data || {};

  return (
    <div>
      <div className="page-header">
        <div className="page-eyebrow">Monitoramento</div>
        <h1 className="page-title">Central de Alertas</h1>
        <p className="page-sub">Monitoramento automático de anomalias e alertas de performance da carteira.</p>
      </div>
      {err && <Alert>{err}</Alert>}
      {loading && <div style={{padding:80,textAlign:"center"}}><Spinner size={28}/></div>}

      {d && !loading && (
        <div>
          <div className="kpi-grid">
            {[["Críticos","rose",d.totals?.critical||0],["Avisos","amber",d.totals?.warnings||0],["Ações","lime",d.totals?.actions||0]].map(([l,c,v]) => (
              <div key={l} className={`kpi-card ${c}`}>
                <div className="kpi-label">{l}</div>
                <div className="kpi-value" style={{color:`var(--${c})`}}>{v}</div>
              </div>
            ))}
          </div>

          {[["🔴 Críticos","critical","rose"],["⚠ Avisos","warnings","amber"],["→ Ações","actions","lime"]].map(([title,key,c]) => {
            const items = d[key] || [];
            if (!items.length) return null;
            return (
              <div key={key} className="card">
                <div className="card-title">{title}</div>
                {items.map((a,i) => (
                  <div key={i} style={{display:"flex",gap:12,padding:"10px 0",borderBottom:"1px solid var(--line)",alignItems:"flex-start"}}>
                    <span style={{color:`var(--${c})`,fontSize:11,fontWeight:700,whiteSpace:"nowrap",marginTop:2}}>{a.client_name}</span>
                    <span style={{fontSize:13.5,color:"var(--text-2)",lineHeight:1.5}}>{a.message}</span>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ── APP ROOT ── */
function App() {
  const [section, setSection] = useState("dashboard");
  const [auth, setAuth] = useState(!!getToken());

  function logout() { clearToken(); setAuth(false); }

  if (!auth) return <LoginPage onLogin={() => setAuth(true)} />;

  const pages = {
    dashboard: <Dashboard />,
    clients: <ClientsPanel />,
    portfolio: <Portfolio />,
    landing_pages: <LandingPages />,
    leads: <Leads />,
    segmentations: <Segmentations />,
    workflows: <Workflows />,
    campaigns: <Campaigns />,
    flow_studio: <FlowStudio />,
    health_audit: <HealthAudit />,
    prospect: <Prospect />,
    report: <ExecutiveReport />,
    alerts: <AlertsPanel />,
  };

  return (
    <div className="app">
      <Sidebar section={section} setSection={setSection} onLogout={logout} />
      <main className="main">
        {pages[section] || <Dashboard />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
