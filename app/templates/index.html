<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>RD Manager IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg: #030708;
      --panel: #0b0f13;
      --panel-2: #12181f;
      --line: #1e2933;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #10b981;
      --green-soft: rgba(16, 185, 129, 0.1);
      --yellow: #f59e0b;
      --yellow-soft: rgba(245, 158, 11, 0.1);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.1);
      --blue: #3b82f6;
      --blue-soft: rgba(59, 130, 246, 0.1);
      --accent: #10b981;
      --shadow: 0 10px 40px -10px rgba(0,0,0,0.5);
      --radius: 12px;
      --sidebar-width: 280px;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.05) 0, transparent 50%),
        radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.05) 0, transparent 50%);
      color: var(--text);
      overflow-x: hidden;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: var(--sidebar-width);
      background: rgba(11, 15, 19, 0.8);
      border-right: 1px solid var(--line);
      padding: 32px 20px;
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .brand {
      margin-bottom: 40px;
    }

    .brand h2 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .nav-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin: 24px 0 12px 12px;
      opacity: 0.6;
    }

    .sidebar button {
      width: 100%;
      margin-bottom: 4px;
      padding: 10px 14px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      text-align: left;
      cursor: pointer;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar button:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    .sidebar button.active {
      background: var(--green-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .main {
      flex: 1;
      padding: 40px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .hero {
      background: linear-gradient(135deg, var(--panel) 0%, #080b0f 100%);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 40px;
      margin-bottom: 32px;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 300px;
      height: 300px;
      background: var(--accent);
      filter: blur(120px);
      opacity: 0.1;
      pointer-events: none;
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      max-width: 700px;
      line-height: 1.6;
      font-size: 16px;
    }

    .card {
      background: var(--panel);
      padding: 24px;
      border-radius: var(--radius);
      margin-bottom: 24px;
      border: 1px solid var(--line);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      border-color: rgba(255,255,255,0.1);
    }

    .btn {
      background: var(--accent);
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      color: #000;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.1);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }

    .btn.secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .btn.blue {
      background: var(--blue);
      color: #fff;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error-box {
      background: var(--red-soft);
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 24px;
      color: #fca5a5;
      font-size: 14px;
      font-weight: 500;
    }

    .success-box {
      background: var(--green-soft);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 24px;
      color: #6ee7b7;
      font-size: 14px;
      font-weight: 500;
    }

    input, textarea, select {
      display: block;
      margin-bottom: 16px;
      padding: 12px 16px;
      width: 100%;
      max-width: 400px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #080b0f;
      color: white;
      font-family: inherit;
      font-size: 14px;
      transition: border-color 0.2s ease;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .kpi-card {
      background: var(--panel);
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }

    .kpi-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .kpi-value {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .badge.green { background: var(--green-soft); color: #34d399; }
    .badge.yellow { background: var(--yellow-soft); color: #fbbf24; }
    .badge.red { background: var(--red-soft); color: #f87171; }
    .badge.blue { background: var(--blue-soft); color: #60a5fa; }

    .ai-report {
      background: #080b0f;
      border-radius: 8px;
      padding: 20px;
      line-height: 1.6;
      font-size: 15px;
    }

    .ai-report h4 {
      color: var(--accent);
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 700;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #2d3a47; }

    @media (max-width: 768px) {
      .app { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: relative; padding: 20px; }
      .main { padding: 20px; }
      .hero { padding: 24px; }
      .hero h1 { font-size: 28px; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in { animation: fadeIn 0.4s ease forwards; }

    .bar-hover:hover { opacity: 1 !important; transform: scaleX(1.1); transition: all 0.2s; }
    .tooltip {
      position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
      background: #fff; color: #000; padding: 2px 6px; border-radius: 4px;
      font-size: 10px; font-weight: bold; display: none;
    }
    .bar-hover:hover .tooltip { display: block; }

  </style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const API = "";
const BUILD_TAG = "2026-04-11-v1.2-api-v2-corrected";
console.log("RD Manager IA build:", BUILD_TAG);

function getToken() {
  try {
    return localStorage.getItem("rd_manager_token");
  } catch (_err) {
    return null;
  }
}

function saveSession(data) {
  try {
    if (data?.access_token) {
      localStorage.setItem("rd_manager_token", data.access_token);
    }
    if (data?.username) {
      localStorage.setItem("rd_manager_username", data.username);
    }
  } catch (_err) {}
}

function clearSession() {
  try {
    localStorage.removeItem("rd_manager_token");
    localStorage.removeItem("rd_manager_username");
  } catch (_err) {}
}

function normalizeAiReport(payload) {
  if (payload == null) return "";
  if (typeof payload === "string") return payload;
  try {
    return JSON.stringify(payload, null, 2);
  } catch (_err) {
    return String(payload);
  }
}

function renderAiReport(reportText) {
  const text = (reportText || "").trim();
  if (!text) return null;

  if (text.startsWith("{") || text.startsWith("[")) {
    return <pre>{text}</pre>;
  }

  const blocks = text.split(/\n{2,}/).map((b) => b.trim()).filter(Boolean);

  return (
    <div className="ai-report">
      {blocks.map((block, i) => {
        const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
        const first = lines[0] || "";
        const isTitle = first.endsWith(":") && first.length < 90;

        if (isTitle) {
          return (
            <div key={i} style={{marginBottom: 12}}>
              <h4>{first.replace(/:$/, "")}</h4>
              {lines.slice(1).map((line, idx) => <p key={idx}>{line}</p>)}
            </div>
          );
        }

        return <p key={i}>{block}</p>;
      })}
    </div>
  );
}

function parseFlowPlan(text) {
  const raw = (text || "").trim();
  if (!raw) return { name: "", objective: "", steps: [] };

  const lines = raw.split("\n").map((l) => l.trim()).filter(Boolean);
  const nameLine = lines.find((l) => /nome do fluxo/i.test(l)) || "";
  const objectiveLine = lines.find((l) => /objetivo do fluxo/i.test(l)) || "";
  const steps = [];

  lines.forEach((line, idx) => {
    const dayMatch = line.match(/(?:dia|espera|aguardar)\s*(\d+)/i);
    const isStep = dayMatch || line.includes("Email") || line.includes("Etapa") || line.includes("Passo");
    if (!isStep) return;

    const day = dayMatch ? Number(dayMatch[1]) : (steps.length > 0 ? steps[steps.length-1].day + 2 : 1);
    const next = lines[idx + 1] || "";
    const theme =
      (line.match(/(?:tema|assunto|título)[^:]*:\s*([^|-]+)/i) || [])[1] ||
      (next.match(/(?:tema|assunto|título)[^:]*:\s*([^|-]+)/i) || [])[1] ||
      "";
    const objective =
      (line.match(/(?:objetivo|meta)[^:]*:\s*([^|-]+)/i) || [])[1] ||
      (next.match(/(?:objetivo|meta)[^:]*:\s*([^|-]+)/i) || [])[1] ||
      "";
    const cta =
      (line.match(/cta[^:]*:\s*([^|-]+)/i) || [])[1] ||
      (next.match(/cta[^:]*:\s*([^|-]+)/i) || [])[1] ||
      "Continuar no fluxo";

    steps.push({
      id: `${day}-${idx}`,
      day,
      title: theme ? theme.trim().replace(/\*\*/g, "") : `Etapa dia ${day}`,
      objective: objective ? objective.trim().replace(/\*\*/g, "") : "Evoluir lead na jornada",
      cta: cta.trim().replace(/\*\*/g, ""),
      raw: line,
    });
  });

  return {
    name: nameLine.replace(/\*\*/g, ""),
    objective: objectiveLine.replace(/\*\*/g, ""),
    steps,
  };
}

async function api(url, options = {}) {
  const token = getToken();
  const headers = {
    ...(options.body ? { "Content-Type": "application/json" } : {}),
    ...(token ? { Authorization: `Bearer ${token}` } : {}),
    ...(options.headers || {})
  };

  const res = await fetch(API + url, {
    ...options,
    headers
  });

  const text = await res.text();

  let data = null;
  try {
    data = text ? JSON.parse(text) : null;
  } catch (e) {
    if (!res.ok) throw new Error(text || "Erro do servidor");
    return text;
  }

  if (!res.ok) {
    const detail = data?.detail || text || "Erro do servidor";
    if (res.status === 401) {
      clearSession();
    }

    throw new Error(detail);
  }

  return data;
}

function Sidebar({ section, setSection, logout }) {
  return (
    <div className="sidebar">
      <div className="brand">
        <h2>RD Manager IA</h2>
        <p>Ferramenta de agência para score, risco, expansão, relatórios e módulos reais da RD.</p>
        <div style={{fontSize:"11px", color:"var(--blue)", marginTop:"10px", fontWeight:"bold"}}>
          SISTEMA ATUALIZADO (v1.1)
        </div>
      </div>

      <div className="nav-title">Operação</div>
      <button type="button" className={section==="dashboard"?"active":""} onClick={()=>setSection("dashboard")}>Dashboard</button>
      <button type="button" className={section==="clients"?"active":""} onClick={()=>setSection("clients")}>Clientes</button>

      <div className="nav-title">Módulos RD</div>
      <button type="button" className={section==="landing_pages"?"active":""} onClick={()=>setSection("landing_pages")}>Landing Pages</button>

function LoginPage({ onLogin }) {
  const [username, setUsername] = React.useState("admin");
  const [password, setPassword] = React.useState("");
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState("");

  async function submit(e) {
    e.preventDefault();
    try {
      setLoading(true);
      setError("");

      const body = new URLSearchParams();
      body.set("username", username);
      body.set("password", password);

      const loginRes = await fetch(API + "/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body.toString(),
      });

      const text = await loginRes.text();
      let data = {};
      try {
        data = text ? JSON.parse(text) : {};
      } catch (_parseErr) {
        data = { detail: text || "Falha no login" };
      }

      if (!loginRes.ok) {
        throw new Error(data?.detail || "Falha no login");
      }

      saveSession(data);
      onLogin();
    } catch (err) {
      setError(err.message || "Erro ao autenticar");
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="main" style={{maxWidth: 460, margin: "40px auto"}}>
      <div className="hero">
        <h1>RD Manager IA</h1>
        <p>Entre com usuário e senha para acessar o painel.</p>
      </div>

      <form className="card" onSubmit={submit}>
        {error && <div className="error-box">{error}</div>}
        <input value={username} onChange={(e) => setUsername(e.target.value)} placeholder="Usuário" />
        <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Senha" />
        <button className="btn" type="submit" disabled={loading}>
          {loading ? "Entrando..." : "Entrar"}
        </button>
      </form>
    </div>
  );
}



function ClientsPanel({ reloadDashboard }) {
  const [clients, setClients] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const [saving, setSaving] = React.useState(false);
  const [syncingId, setSyncingId] = React.useState(null);
  const [error, setError] = React.useState("");
  const [form, setForm] = React.useState({
    name: "",
    segment: "",
    website: "",
    description: "",
  });

  async function loadClients() {
    try {
      setLoading(true);
      setError("");
      const res = await api("/api/clients/");
      setClients(Array.isArray(res) ? res : []);
    } catch (e) {
      setError(e.message || "Erro ao carregar clientes");
    } finally {
      setLoading(false);
    }
  }

  React.useEffect(() => {
    loadClients();
  }, []);

  async function createClient() {
    if (!form.name.trim()) {
      setError("Informe o nome do cliente.");
      return;
    }

    try {
      setSaving(true);
      setError("");
      await api("/api/clients/", {
        method: "POST",
        body: JSON.stringify(form),
      });
      setForm({ name: "", segment: "", website: "", description: "" });
      await loadClients();
      if (reloadDashboard) await reloadDashboard();
    } catch (e) {
      setError(e.message || "Erro ao criar cliente");
    } finally {
      setSaving(false);
    }
  }

  async function syncClient(clientId) {
    try {
      setSyncingId(clientId);
      setError("");
      await api(`/api/rdsync/run/${clientId}`, { method: "POST" });
      await loadClients();
      if (reloadDashboard) await reloadDashboard();
    } catch (e) {
      setError(e.message || "Erro ao sincronizar cliente");
    } finally {
      setSyncingId(null);
    }
  }

  return (
    <div>
      <div className="hero">
        <h1>Clientes</h1>
        <p>Cadastre clientes, conecte RD e execute sincronização completa.</p>
      </div>

      {error && <div className="error-box">{error}</div>}

      <div className="card">
        <h3>Novo cliente</h3>
        <input
          placeholder="Nome"
          value={form.name}
          onChange={e => setForm({ ...form, name: e.target.value })}
        />
        <input
          placeholder="Segmento"
          value={form.segment}
          onChange={e => setForm({ ...form, segment: e.target.value })}
        />
        <input
          placeholder="Website"
          value={form.website}
          onChange={e => setForm({ ...form, website: e.target.value })}
        />
        <textarea
          placeholder="Descrição"
          value={form.description}
          onChange={e => setForm({ ...form, description: e.target.value })}
        />
        <button type="button" className="btn" onClick={createClient} disabled={saving}>
          {saving ? "Salvando..." : "Adicionar cliente"}
        </button>
      </div>

      <div className="card">
        <div className="row">
          <h3 style={{ margin: 0 }}>Carteira</h3>
          <button type="button" className="btn secondary" onClick={loadClients} disabled={loading}>
            {loading ? "Atualizando..." : "Atualizar"}
          </button>
        </div>

        {clients.length === 0 ? (
          <div className="muted" style={{ marginTop: 12 }}>Nenhum cliente cadastrado.</div>
        ) : clients.map((c) => (
          <div key={c.id} className="status-box" style={{ marginTop: 12 }}>
            <div className="row">
              <strong>{c.name}</strong>
              <span className={`badge ${c.rd_connected ? "green" : "red"}`}>
                {c.rd_connected ? "RD conectada" : "RD não conectada"}
              </span>
            </div>

            <div className="muted" style={{ marginTop: 8 }}>
              {c.segment || "Sem segmento"}
              {c.website ? ` • ${c.website}` : ""}
            </div>

            <div style={{ marginTop: 10 }}>
              <a className="btn blue" href={`/oauth/authorize/${c.id}`}>Conectar RD</a>
              <button type="button" className="btn" onClick={() => syncClient(c.id)} disabled={syncingId === c.id}>
                {syncingId === c.id ? "Sincronizando..." : "Sincronizar"}
              </button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}


function Dashboard({ data, reload }) {
  const [loadingSync, setLoadingSync] = React.useState(false);

  async function syncAll() {
    try {
      setLoadingSync(true);
      await api("/api/rdsync/run-all"); // Assuming this endpoint exists or will be added
      await reload();
    } catch (e) {
      alert(e.message);
    } finally {
      setLoadingSync(false);
    }
  }

  const stats = data?.stats || {
    total_clients: 0,
    active_tokens: 0,
    total_leads: 0,
    avg_score: 0
  };

  return (

function ModulePage({ moduleName, title, description }) {
  const [clients, setClients] = React.useState([]);
  const [clientId, setClientId] = React.useState("");
  const [overview, setOverview] = React.useState(null);
  const [data, setData] = React.useState(null);
  const [error, setError] = React.useState("");
  const [loading, setLoading] = React.useState(false);
  const [aiLoading, setAiLoading] = React.useState(false);
  const [aiReport, setAiReport] = React.useState("");
  const [landingModalOpen, setLandingModalOpen] = React.useState(false);
  const [landingModalTitle, setLandingModalTitle] = React.useState("");
  const [leadFilter, setLeadFilter] = React.useState("all");
  const [leadSourceFilter, setLeadSourceFilter] = React.useState("all");
  const [leadSearch, setLeadSearch] = React.useState("");
  const [segSearch, setSegSearch] = React.useState("");
  const [workflowOpenKey, setWorkflowOpenKey] = React.useState("");
  const [stepEmailLoading, setStepEmailLoading] = React.useState("");

  React.useEffect(() => {
    loadClients();
  }, []);

  async function loadClients() {
    try {
      const res = await api("/api/clients/");
      const list = Array.isArray(res) ? res : [];
      setClients(list);
      if (list.length > 0 && !clientId) setClientId(String(list[0].id));
    } catch (e) {
      setError(e.message || "Erro ao carregar clientes");
    }
  }

  async function loadModule() {
    if (!clientId) return;

    try {
      setLoading(true);
      setError("");
      setAiReport("");

      const [overviewRes, itemsRes] = await Promise.all([
        api(`/api/rd-modules/client/${clientId}/overview`),
        api(`/api/rd-modules/client/${clientId}/${moduleName}?limit=100`),
      ]);

      setOverview(overviewRes?.data || null);
      setData(itemsRes?.data || null);
    } catch (e) {
      setError(e.message || "Erro ao carregar módulo");
    } finally {
      setLoading(false);
    }
  }

  function normalizeItems() {
    const items = data?.items || [];
    return items.map((it) => ({
      key: it.object_key,
      synced_at: it.synced_at,
      payload: it.payload || {},
      title:
        it.payload?.title ||
        it.payload?.name ||
        it.payload?.email ||
        it.payload?.subject ||
        it.object_key,
      status:
        it.payload?.status ||
        it.payload?.state ||
        it.payload?.workflow_status ||
        "—",
      metric:
        it.payload?.conversion_rate ||
        it.payload?.open_rate ||
        it.payload?.click_rate ||
        it.payload?.contacts_count ||
        it.payload?.visitors_count ||
        it.payload?.created_at ||
        "—",
    }));
  }

  function extractLandingUrl(item) {
    if (!item || !item.payload) return "";
    const p = item.payload || {};

    // Ordem de preferência dos campos de URL
    // O backend agora constrói public_url via conversion_identifier
    const candidates = [
      p.public_url,
      p.url,
      p.page_url,
      p.link,
      p.canonical_url,
      p.landing_page_url,
      p?.meta?.url,
      p?.site?.url,
      p?.links?.public_url,
    ].filter(u => typeof u === "string" && u.startsWith("http"));

    // Fallback: constrói a URL a partir do conversion_identifier
    if (!candidates.length && p.conversion_identifier) {
      return `https://conteudo.rdstation.com/${p.conversion_identifier}`;
    }

    return candidates[0] || "";
  }

  function normalizeLead(item) {
    const p = item.payload || {};
    const lc = p.last_conversion || {};
    const firstConversion = Array.isArray(p.conversions) ? p.conversions[0] : null;

    const source =
      p.source ||
      p.traffic_source ||
      p.utm_source ||
      p.origin ||
      lc.source ||
      lc.channel ||
      lc.conversion_origin ||
      firstConversion?.source ||
      firstConversion?.origin ||
      firstConversion?.conversion_origin ||
      p?.last_conversion?.content?.identificador ||
      "indefinido";

    const conversions = Number(
      p.conversions_count ||
      p.conversions ||
      p.conversion_count ||
      (Array.isArray(p.conversions) ? p.conversions.length : 0) ||
      0
    );

    const lastInteractionRaw =
      p.last_interaction_at ||
      p.last_conversion_date ||
      lc.created_at ||
      p.updated_at ||
      p.created_at ||
      null;

    const lastDate = lastInteractionRaw ? new Date(lastInteractionRaw) : null;
    const inactiveDays = lastDate && !Number.isNaN(lastDate.getTime())
      ? Math.max(0, Math.floor((Date.now() - lastDate.getTime()) / (1000 * 60 * 60 * 24)))
      : null;

    const engagement = Math.max(0, Math.min(100, (conversions * 18) + (inactiveDays !== null ? Math.max(0, 35 - inactiveDays) : 0)));
    const score = Math.max(0, Math.min(100, (conversions * 20) + (p.email ? 10 : 0) + (source !== "indefinido" ? 10 : 0)));

    return {
      key: item.key,
      name: p.name || (p.email ? p.email.split("@")[0] : "Lead sem nome"),
      email: p.email || p.personal_email || "—",
      stage: p.lifecycle_stage || p.stage || p.status || "—",
      lastConversion: lastInteractionRaw || "—",
      source,
      score,
      engagement,
      inactiveDays,
      isActive: (p.status || "").toLowerCase() !== "inactive",
    };
  }

  async function runAiAnalysis(selectedItem = null) {
    const items = normalizeItems();
    if (!items.length) return;

    try {
      setAiLoading(true);
      setError("");
      const rawItems = selectedItem ? [selectedItem.payload] : items.map(i => i.payload);

      if (moduleName === "landing_pages") {
        const item = selectedItem || items[0];
        const url = extractLandingUrl(item);
        if (!url) {
          const res = await api("/api/flows-advanced/generate-email", {
            method: "POST",
            body: JSON.stringify({
              context: `Faça uma análise estratégica da landing page apenas pelo payload sincronizado: ${JSON.stringify(item?.payload || {}).slice(0, 4000)}`,
              theme: "Análise SEO/CRO de landing page sem URL pública",
              objective: "sugerir melhorias práticas",
              tone: "consultivo",
              cta: "aplicar melhorias",
            }),
          });
          setLandingModalTitle(item?.title || "Landing Page");
          setAiReport(normalizeAiReport(res?.email || res));
          setLandingModalOpen(true);
          return;
        }
        const res = await api("/api/landing-pages/analyze", {
          method: "POST",
          body: JSON.stringify({ url }),
        });
        setLandingModalTitle(item?.title || "Landing Page");
        setAiReport(normalizeAiReport(res?.analysis || res));
        setLandingModalOpen(true);
        return;
      }

      if (moduleName === "leads") {
        const res = await api("/api/leads/analyze-base", {
          method: "POST",
          body: JSON.stringify({ client_id: Number(clientId), leads: rawItems }),
        });
        setAiReport(normalizeAiReport(res?.analysis || res));
        return;
      }

      if (moduleName === "segmentations") {
        const target = selectedItem ? [selectedItem.payload] : rawItems;
        const res = await api("/api/leads/segment", {
          method: "POST",
          body: JSON.stringify({ client_id: Number(clientId), segmentations: target }),
        });
        setAiReport(normalizeAiReport(res?.segments || res));
        return;
      }

      if (moduleName === "workflows") {
        const contextPayload = selectedItem ? [selectedItem.payload] : rawItems;
        const res = await api("/api/flows-advanced/generate-flow", {
          method: "POST",
          body: JSON.stringify({
            goal: "melhorar engajamento e conversão de workflows RD",
            product: "Serviços de agência",
            audience: "base ativa e inativa",
            awareness: "misto",
            flow_type: "workflow RD",
            flow_days: 14,
            email_count: 5,
            context: contextPayload,
          }),
        });
        setAiReport(normalizeAiReport(res?.flow || res));
        return;
      }

      if (moduleName === "campaigns") {
        const contextPayload = selectedItem ? [selectedItem.payload] : rawItems;
        const res = await api("/api/flows-advanced/generate-email", {
          method: "POST",
          body: JSON.stringify({
            context: `Monte um relatório da campanha e melhorias práticas: ${JSON.stringify(contextPayload).slice(0, 4000)}`,
            theme: "relatório de campanha",
            objective: "aumentar performance",
            tone: "estratégico",
            cta: "aplicar melhorias sugeridas",
          }),
        });
        setAiReport(normalizeAiReport(res?.email || res));
        return;
      }

      setAiReport(normalizeAiReport("Análise IA não configurada para este módulo."));
    } catch (e) {
      setError(e.message || "Erro ao rodar análise IA");
    } finally {
      setAiLoading(false);
    }
  }

  const moduleInfo = overview?.modules?.[moduleName];
  const items = normalizeItems();
  const leads = items.map(normalizeLead);
  const leadSources = Array.from(new Set(leads.map((l) => l.source))).sort();
  const filteredLeads = leads.filter((lead) => {
    if (leadFilter === "active" && !lead.isActive) return false;
    if (leadFilter === "inactive" && lead.isActive) return false;
    if (leadFilter === "high" && lead.score < 70) return false;
    if (leadSourceFilter !== "all" && lead.source !== leadSourceFilter) return false;
    if (leadSearch && !`${lead.name} ${lead.email}`.toLowerCase().includes(leadSearch.toLowerCase())) return false;
    return true;
  });
  const segmentationItems = items.filter((it) => moduleName === "segmentations").map((it) => {
    const p = it.payload || {};
    const updatedRaw = p.updated_at || p.last_updated_at || it.synced_at;
    const updatedDate = updatedRaw ? new Date(updatedRaw) : null;
    const inactiveDays = updatedDate && !Number.isNaN(updatedDate.getTime())
      ? Math.max(0, Math.floor((Date.now() - updatedDate.getTime()) / (1000 * 60 * 60 * 24)))
      : null;
    return {
      ...it,
      name: p.name || p.title || it.title,
      contacts: p.contacts || p.contacts_count || p.leads || 0,
      updatedRaw: updatedRaw || "—",
      inactiveDays,
      lastInteraction: p.last_interaction_at || p.last_conversion_date || updatedRaw || "—",
    };
  });
  const filteredSegmentations = segmentationItems.filter((seg) =>
    !segSearch || String(seg.name || "").toLowerCase().includes(segSearch.toLowerCase())
  );
  const workflowItems = items.filter((it) => moduleName === "workflows");
  const campaignItems = items.filter((it) => moduleName === "campaigns");
  const parsedWorkflowReport = parseFlowPlan(aiReport);

  async function generateStepEmail(step, contextLabel = "workflow") {
    try {
      setStepEmailLoading(step.id || `${step.day}`);
      setError("");
      const res = await api("/api/flows-advanced/generate-email", {
        method: "POST",
        body: JSON.stringify({
          context: `Crie um email para etapa do ${contextLabel}. Contexto da etapa: ${JSON.stringify(step)}`,
          theme: step.title || `Email dia ${step.day}`,
          objective: step.objective || "Avançar lead no fluxo",
          cta: step.cta || "Continuar no fluxo",
          tone: "consultivo e objetivo",
          target: "lead da automação",
        }),
      });
      setAiReport(normalizeAiReport(res?.email || res));
    } catch (e) {
      setError(e.message || "Erro ao gerar email da etapa");
    } finally {
      setStepEmailLoading("");
    }
  }

  return (
    <div>
      <div className="hero">
        <h1>{title}</h1>
        <p>{description}</p>
      </div>

      {error && <div className="error-box">{error}</div>}

      <div className="card">
        <div className="row">
          <select value={clientId} onChange={(e) => setClientId(e.target.value)}>
            <option value="">Selecione um cliente</option>
            {clients.map((client) => (
              <option key={client.id} value={client.id}>{client.name}</option>
            ))}
          </select>
          <div>
            <button type="button" className="btn" onClick={loadModule} disabled={loading || !clientId}>
              {loading ? "Carregando..." : "Carregar módulo"}
            </button>
            {moduleName !== "landing_pages" && (
              <button type="button" className="btn blue" onClick={() => runAiAnalysis()} disabled={aiLoading || !data}>
                {aiLoading ? "Analisando IA..." : "Analisar com IA"}
              </button>
            )}
          </div>
        </div>
      </div>

      {moduleInfo && (
        <div className="kpi-grid">
          <div className="kpi-card"><div className="kpi-label">Total Localizado (RD)</div><div className="kpi-value">{moduleInfo.summary_count || moduleInfo.count || 0}</div></div>
          <div className="kpi-card"><div className="kpi-label">Sincronizados (Nesta lista)</div><div className="kpi-value">{moduleInfo.db_count || items.length || 0}</div></div>
          <div className="kpi-card"><div className="kpi-label">Módulo</div><div className="kpi-value" style={{fontSize:18}}>{moduleInfo.label}</div></div>
          <div className="kpi-card"><div className="kpi-label">Status Sync</div><div className="kpi-value" style={{fontSize:"18px"}}>{moduleInfo.synced_at ? "OK" : "Pendente"}</div></div>
        </div>
      )}

      {aiReport && (
        <div className="card">
          <h3>Relatório IA ({title})</h3>
          {renderAiReport(aiReport)}
        </div>
      )}

      {!loading && data && items.length === 0 && (
        <div className="card">Nenhum item sincronizado para este módulo.</div>
      )}

      {moduleName === "landing_pages" && items.length > 0 && (
        <div className="card">
          <h3>Landing Pages v2</h3>
          <div className="two-col">
            {items.map((item, index) => {
              const url = extractLandingUrl(item);
              return (
                <div className="status-box" key={item.key || index}>
                  <div className="row">
                    <strong>{item.title}</strong>
                    <span className="badge blue">{item.status}</span>
                  </div>
                  <div className="muted" style={{marginTop: 8}}>{item.synced_at || "Sem data"}</div>
                  <div className="muted" style={{marginTop: 6}}>
                    {url ? <a href={url} target="_blank" rel="noreferrer">{url}</a> : "URL não encontrada"}
                  </div>
                  <div className="metric-row">
                    <div className="mini-metric">
                      <div className="mini-metric-label">Visitas</div>
                      <div className="mini-metric-value" style={{fontSize:14}}>
                        {item.payload?.visits_count ?? "—"}
                      </div>
                    </div>
                    <div className="mini-metric">
                      <div className="mini-metric-label">Conversões</div>
                      <div className="mini-metric-value" style={{fontSize:14}}>
                        {item.payload?.conversions_count ?? "—"}
                      </div>
                    </div>
                    <div className="mini-metric">
                      <div className="mini-metric-label">Taxa</div>
                      <div className="mini-metric-value" style={{fontSize:14}}>
                        {item.payload?.conversion_rate != null
                          ? `${(item.payload.conversion_rate * 100).toFixed(1)}%`
                          : "—"}
                      </div>
                    </div>
                  </div>
                  <div style={{marginTop: 12}}>
                    <button type="button" className="btn blue" onClick={() => runAiAnalysis(item)} disabled={aiLoading || !url}>
                      {aiLoading ? "Analisando..." : "Analisar SEO+GEO com IA"}
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {moduleName === "leads" && items.length > 0 && (
        <div className="card">
          <h3>Leads v2</h3>
          <div className="row">
            <input placeholder="Buscar lead" value={leadSearch} onChange={(e) => setLeadSearch(e.target.value)} />
            <select value={leadFilter} onChange={(e) => setLeadFilter(e.target.value)}>
              <option value="all">Todos</option>
              <option value="active">Ativos</option>
              <option value="inactive">Inativos</option>
              <option value="high">Alto potencial</option>
            </select>
            <select value={leadSourceFilter} onChange={(e) => setLeadSourceFilter(e.target.value)}>
              <option value="all">Todas as fontes</option>
              {leadSources.map((src) => <option key={src} value={src}>{src}</option>)}
            </select>
          </div>
          <div className="table-card">
            {filteredLeads.map((lead, idx) => (
              <div className="table-row" key={lead.key || idx}>
                <div className="row">
                  <strong>{lead.name}</strong>
                  <span className="badge blue">{lead.stage}</span>
                </div>
                <div className="metric-row">
                  <div className="mini-metric"><div className="mini-metric-label">Email</div><div className="mini-metric-value" style={{fontSize:14}}>{lead.email}</div></div>
                  <div className="mini-metric"><div className="mini-metric-label">Última conversão</div><div className="mini-metric-value" style={{fontSize:14}}>{lead.lastConversion}</div></div>
                  <div className="mini-metric"><div className="mini-metric-label">Origem</div><div className="mini-metric-value" style={{fontSize:14}}>{lead.source}</div></div>
                  <div className="mini-metric"><div className="mini-metric-label">Score</div><div className="mini-metric-value" style={{fontSize:14}}>{lead.score}</div></div>
                  <div className="mini-metric"><div className="mini-metric-label">Engajamento</div><div className="mini-metric-value" style={{fontSize:14}}>{lead.engagement}</div></div>
                  <div className="mini-metric"><div className="mini-metric-label">Sem interação (dias)</div><div className="mini-metric-value" style={{fontSize:14}}>{lead.inactiveDays ?? "—"}</div></div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {moduleName === "segmentations" && filteredSegmentations.length > 0 && (
        <div className="card">
          <h3>Segmentações</h3>
          <div className="row">
            <input placeholder="Filtrar segmentação por nome" value={segSearch} onChange={(e) => setSegSearch(e.target.value)} />
          </div>
          <div className="table-card">
            {filteredSegmentations.map((item, index) => (
              <div className="table-row" key={item.key || index}>
                <div className="row">
                  <strong>{item.name}</strong>
                  <span className="muted">{item.updatedRaw}</span>
                </div>
                <div className="metric-row" style={{gridTemplateColumns:"repeat(3, 1fr)"}}>
                  <div className="mini-metric"><div className="mini-metric-label">Leads</div><div className="mini-metric-value" style={{fontSize:14}}>{item.contacts}</div></div>
                  <div className="mini-metric"><div className="mini-metric-label">Sem interação (dias)</div><div className="mini-metric-value" style={{fontSize:14}}>{item.inactiveDays ?? "—"}</div></div>
                  <div className="mini-metric"><div className="mini-metric-label">Última interação</div><div className="mini-metric-value" style={{fontSize:14}}>{item.lastInteraction}</div></div>

                <div style={{marginTop:10}}>

function FlowStudio() {
  const [goal, setGoal] = React.useState("Qualificação de Lead");
  const [product, setProduct] = React.useState("");
  const [audience, setAudience] = React.useState("");
  const [awareness, setAwareness] = React.useState("Misto");
  const [flowType, setFlowType] = React.useState("Nutrição");
  const [flowDays, setFlowDays] = React.useState(14);
  const [emailCount, setEmailCount] = React.useState(5);
  const [flow, setFlow] = React.useState("");
  const [emailContext, setEmailContext] = React.useState("");
  const [emailTheme, setEmailTheme] = React.useState("");
  const [emailObjective, setEmailObjective] = React.useState("");
  const [emailTone, setEmailTone] = React.useState("Consultivo");
  const [emailCta, setEmailCta] = React.useState("Responder este email");
  const [email, setEmail] = React.useState("");
  const [loadingFlow, setLoadingFlow] = React.useState(false);
  const [loadingEmail, setLoadingEmail] = React.useState(false);
  const [stepEmailLoading, setStepEmailLoading] = React.useState("");
  const [error, setError] = React.useState("");
  const parsedFlow = parseFlowPlan(flow);

  async function generateFlow() {
    try {
      setLoadingFlow(true);
      setError("");
      const res = await api("/api/flows-advanced/generate-flow", {
        method: "POST",
        body: JSON.stringify({
          goal,
          product,
          audience,
          awareness,
          flow_type: flowType,
          flow_days: Number(flowDays) || 10,
          email_count: Number(emailCount) || 4,
        }),
      });
      setFlow(res?.flow || "Sem retorno");
    } catch (e) {
      setError(e.message || "Erro ao gerar fluxo");
    } finally {
      setLoadingFlow(false);
    }
  }

  async function generateEmail() {
    try {
      setLoadingEmail(true);
      setError("");
      const res = await api("/api/flows-advanced/generate-email", {
        method: "POST",
        body: JSON.stringify({
          context: emailContext || flow || "Gerar email de nutrição",
          theme: emailTheme || "Nutrição",
          objective: emailObjective || "Gerar resposta",
          tone: emailTone,
          cta: emailCta,
          target: audience,
        }),
      });
      setEmail(res?.email || "Sem retorno");
    } catch (e) {
      setError(e.message || "Erro ao gerar email");
    } finally {
      setLoadingEmail(false);
    }
  }

  async function generateEmailForStep(step) {
    try {
      setStepEmailLoading(step.id || `${step.day}`);
      setError("");
      const res = await api("/api/flows-advanced/generate-email", {
        method: "POST",
        body: JSON.stringify({
          context: `Fluxo: ${flow}\n\nEtapa atual: ${JSON.stringify(step)}`,
          theme: step.title || `Email dia ${step.day}`,
          objective: step.objective || "Avançar lead",
          tone: emailTone,
          cta: step.cta || emailCta,
          target: audience,
        }),
      });
      setEmail(res?.email || "Sem retorno");
    } catch (e) {
      setError(e.message || "Erro ao gerar email da etapa");
    } finally {
      setStepEmailLoading("");
    }
  }

  return (
    <div>
      <div className="hero">
        <h1>Flow Studio IA</h1>
        <p>Gere fluxos estratégicos e emails prontos para execução no RD Station.</p>
      </div>

      {error && <div className="error-box">{error}</div>}

      <div className="card">
        <div className="row" style={{gap:15, marginBottom:15}}>
          <div style={{flex:1}}>
            <label className="muted" style={{fontSize:12, display:"block", marginBottom:4}}>Objetivo Estratégico</label>
            <select value={goal} onChange={e => setGoal(e.target.value)} style={{width:"100%"}}>
              <option value="Qualificação de Lead">🎯 Qualificação de Lead</option>
              <option value="Newsletter">📰 Newsletter / Conteúdo</option>
              <option value="Recuperação de Carrinho">🛒 Recuperação de Carrinho</option>
              <option value="Promoção / Venda Direta">💰 Promoção / Venda Direta</option>
              <option value="Engajamento de Base">🔥 Engajamento de Base</option>
              <option value="Reaquecimento de Leads Cold">❄️ Reaquecimento (Cold Leads)</option>
              <option value="Crescimento / Expansão">📈 Crescimento / Expansão</option>
              <option value="Boas-vindas / Onboarding">👋 Boas-vindas / Onboarding</option>
            </select>
          </div>
          <div style={{flex:1}}>
            <label className="muted" style={{fontSize:12, display:"block", marginBottom:4}}>Tipo de Automação</label>
            <select value={flowType} onChange={e => setFlowType(e.target.value)} style={{width:"100%"}}>
              <option value="Nutrição">Nutrição Padrão</option>
              <option value="Vendas">Foco em Vendas</option>
              <option value="Educativo">Educativo / Autoridade</option>
              <option value="Híbrido">Híbrido (Conteúdo + Promo)</option>
            </select>
          </div>
        </div>

        <div className="row" style={{gap:15, marginBottom:15}}>
          <input value={product} onChange={e => setProduct(e.target.value)} placeholder="Produto ou serviço da agência/cliente" />
          <input value={audience} onChange={e => setAudience(e.target.value)} placeholder="Persona / Público-alvo" />
        </div>

        <div className="row" style={{gap:15, marginBottom:15}}>
          <div style={{flex:1}}>
            <label className="muted" style={{fontSize:12, display:"block", marginBottom:4}}>Nível de Consciência</label>
            <select value={awareness} onChange={e => setAwareness(e.target.value)} style={{width:"100%"}}>
              <option value="Inconsciente">Inconsciente</option>
              <option value="Consciente do Problema">Consciente do Problema</option>
              <option value="Consciente da Solução">Consciente da Solução</option>
              <option value="Misto">Misto / Amplo</option>

          <input type="number" style={{width:100}} value={flowDays} onChange={e => setFlowDays(e.target.value)} placeholder="Dias" />

        <button type="button" className="btn" onClick={generateFlow} disabled={loadingFlow} style={{width:"100%"}}>
          {loadingFlow ? "Arquitetando Estratégia..." : "Gerar Estrutura de Fluxo (Padrão RD Station)"}
        </button>
      </div>

      {flow && <div className="card"><h3>Fluxo sugerido</h3><pre>{flow}</pre></div>}

      {parsedFlow.steps.length > 0 && (
        <div className="card">
          <h3>Mapa do fluxo (etapas acionáveis)</h3>
          <div className="metric-row">
            {parsedFlow.steps.map((step) => (
              <div className="mini-metric" key={step.id}>
                <div className="mini-metric-label">Dia {step.day}</div>
                <div style={{fontWeight: 700, marginBottom: 6}}>{step.title}</div>
                <div className="muted" style={{fontSize: 12, marginBottom: 8}}>{step.objective}</div>
                <button
                  type="button"
                  className="btn blue"
                  onClick={() => generateEmailForStep(step)}
                  disabled={stepEmailLoading === step.id}
                >
                  {stepEmailLoading === step.id ? "Gerando..." : "Gerar email desta etapa"}
                </button>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="card">
        <textarea value={emailContext} onChange={e => setEmailContext(e.target.value)} placeholder="Contexto para geração de email (opcional)" />
        <input value={emailTheme} onChange={e => setEmailTheme(e.target.value)} placeholder="Tema do email" />
        <input value={emailObjective} onChange={e => setEmailObjective(e.target.value)} placeholder="Objetivo do email" />
        <input value={emailTone} onChange={e => setEmailTone(e.target.value)} placeholder="Tom de voz" />
        <input value={emailCta} onChange={e => setEmailCta(e.target.value)} placeholder="CTA principal" />
        <button type="button" className="btn blue" onClick={generateEmail} disabled={loadingEmail}>{loadingEmail ? "Gerando..." : "Gerar email"}</button>
      </div>

      {email && <div className="card"><h3>Email gerado</h3><pre>{email}</pre></div>}
    </div>
  );
}

  React.useEffect(() => {
    api("/api/clients/").then(res => {
      const list = Array.isArray(res) ? res : [];
      setClients(list);
      if (list.length > 0) setClientId(String(list[0].id));
    }).catch(() => {});
  }, []);

  async function runAudit() {
    if (!clientId) return;
    try {
      setLoading(true);
      setError("");
      setAudit(null);
      const res = await api(`/api/health-audit/client/${clientId}`);
      setAudit(res?.data || null);
    } catch(e) {
      setError(e.message || "Erro na auditoria");
    } finally {
      setLoading(false);
    }
  }

  async function runAiComment() {
    if (!clientId) return;
    try {
      setAiLoading(true);
      setError("");
      const res = await api(`/api/health-audit/client/${clientId}?ai=true`);
      setAudit(res?.data || null);
    } catch(e) {
      setError(e.message || "Erro ao gerar diagnóstico IA");
    } finally {
      setAiLoading(false);
    }
  }

  const statusColor = {
    healthy: "#22c55e",
    warning: "#f59e0b",
    critical: "#ef4444",
  };

  function ScoreRing({ score, color }) {
    const r = 38;
    const circ = 2 * Math.PI * r;
    const offset = circ - (score / 100) * circ;
    return (
      <svg width="100" height="100" viewBox="0 0 100 100" style={{display:"block",margin:"0 auto"}}>
        <circle cx="50" cy="50" r={r} fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="10" />
        <circle cx="50" cy="50" r={r} fill="none" stroke={color} strokeWidth="10"
          strokeDasharray={circ} strokeDashoffset={offset}
          strokeLinecap="round"
          style={{transform:"rotate(-90deg)", transformOrigin:"50% 50%", transition:"stroke-dashoffset 0.6s ease"}} />
        <text x="50" y="56" textAnchor="middle" fill="#fff" fontSize="22" fontWeight="bold">{score}</text>
      </svg>
    );
  }

  return (
    <div>
      <div className="hero">
        <h1>🩺 Auditoria de Saúde da Conta</h1>
        <p>Diagnóstico completo: leads por engajamento, workflows parados, LPs críticas e score geral de operação.</p>
      </div>

      {error && <div className="error-box">{error}</div>}

      <div className="card">
        <div className="row">
          <select value={clientId} onChange={e => setClientId(e.target.value)} style={{flex:1}}>
            <option value="">Selecione um cliente</option>
            {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
          <button type="button" className="btn" onClick={runAudit} disabled={loading || !clientId}>
            {loading ? "Auditando..." : "Rodar Auditoria"}
          </button>
          {audit && (
            <button type="button" className="btn blue" onClick={runAiComment} disabled={aiLoading}>
              {aiLoading ? "Analisando IA..." : "🧠 Diagnóstico IA"}
            </button>
          )}
        </div>
      </div>

      {audit && (
        <>
          {/* Score Geral */}
          <div className="kpi-grid">
            <div className="kpi-card" style={{gridColumn:"span 1", textAlign:"center"}}>
              <div className="kpi-label">Score de Saúde</div>
              <ScoreRing score={audit.overall_score} color={statusColor[audit.health_status] || "#64748b"} />
              <div style={{marginTop:8, fontWeight:700, color: statusColor[audit.health_status]}}>{audit.health_label}</div>
            </div>
            <div className="kpi-card">
              <div className="kpi-label">Score Workflows</div>
              <div className="kpi-value">{audit.workflows?.score ?? "—"}<span style={{fontSize:14}}>/100</span></div>
              <div className="muted" style={{fontSize:12, marginTop:4}}>{audit.workflows?.active} ativos · {audit.workflows?.paused} pausados</div>
            </div>
            <div className="kpi-card">
              <div className="kpi-label">Score Leads</div>
              <div className="kpi-value">{audit.leads?.score ?? "—"}<span style={{fontSize:14}}>/100</span></div>
              <div className="muted" style={{fontSize:12, marginTop:4}}>{audit.leads?.engagement_rate}% engajados</div>
            </div>
            <div className="kpi-card">
              <div className="kpi-label">Score Landing Pages</div>
              <div className="kpi-value">{audit.landing_pages?.score ?? "—"}<span style={{fontSize:14}}>/100</span></div>
              <div className="muted" style={{fontSize:12, marginTop:4}}>{audit.landing_pages?.top} top · {audit.landing_pages?.critical} críticas</div>
            </div>
          </div>

          {/* Problemas */}
          {(audit.issues || []).length > 0 && (
            <div className="card" style={{borderLeft:"4px solid #ef4444"}}>
              <h3 style={{marginTop:0, color:"#ef4444"}}>⚠️ Problemas Identificados</h3>
              {audit.issues.map((issue, i) => (
                <div className="list-line" key={i}>🔴 {issue}</div>
              ))}
            </div>
          )}

          {/* Diagnóstico IA */}
          {audit.ai_commentary && (
            <div className="card" style={{borderLeft:"4px solid var(--blue)"}}>
              <h3 style={{marginTop:0, color:"var(--blue)"}}>🧠 Diagnóstico Consultivo da IA</h3>
              {renderAiReport(audit.ai_commentary)}
            </div>
          )}

          <div className="two-col">
            {/* Leads */}
            <div className="card">
              <h3>👥 Base de Leads por Engajamento</h3>
              <div className="metric-row" style={{marginBottom:16}}>
                <div className="mini-metric"><div className="mini-metric-label" style={{color:"#22c55e"}}>🔥 Quentes</div><div className="mini-metric-value">{audit.leads?.hot}</div></div>
                <div className="mini-metric"><div className="mini-metric-label" style={{color:"#f59e0b"}}>🌡 Mornos</div><div className="mini-metric-value">{audit.leads?.warm}</div></div>
                <div className="mini-metric"><div className="mini-metric-label" style={{color:"#60a5fa"}}>❄️ Frios</div><div className="mini-metric-value">{audit.leads?.cold}</div></div>
                <div className="mini-metric"><div className="mini-metric-label" style={{color:"#94a3b8"}}>💀 Mortos</div><div className="mini-metric-value">{audit.leads?.dead}</div></div>
              </div>
              {(audit.leads?.hot_leads || []).length > 0 && (
                <>
                  <div className="muted" style={{fontSize:12, marginBottom:6}}>Top leads quentes:</div>
                  {audit.leads.hot_leads.slice(0,5).map((l,i) => (
                    <div className="list-line" key={i}>🔥 {l.name} <span className="muted" style={{fontSize:11}}>({l.email})</span></div>
                  ))}
                </>
              )}
            </div>

            {/* Workflows */}
            <div className="card">
              <h3>⚙️ Auditoria de Workflows</h3>
              <div className="metric-row" style={{marginBottom:16}}>
                <div className="mini-metric"><div className="mini-metric-label" style={{color:"#22c55e"}}>✅ Ativos</div><div className="mini-metric-value">{audit.workflows?.active}</div></div>
                <div className="mini-metric"><div className="mini-metric-label" style={{color:"#ef4444"}}>⏸ Pausados</div><div className="mini-metric-value">{audit.workflows?.paused}</div></div>
                <div className="mini-metric"><div className="mini-metric-label" style={{color:"#f59e0b"}}>⏰ Desatualizados</div><div className="mini-metric-value">{audit.workflows?.stale}</div></div>
              </div>
              {(audit.workflows?.details?.paused || []).length > 0 && (
                <>
                  <div className="muted" style={{fontSize:12, marginBottom:6}}>Workflows pausados:</div>
                  {audit.workflows.details.paused.slice(0,5).map((wf,i) => (
                    <div className="list-line" key={i}>⏸ {wf.name}</div>
                  ))}
                </>
              )}
            </div>
          </div>

          {/* Landing Pages */}
          <div className="card">
            <h3>📄 Performance das Landing Pages</h3>
            <div className="metric-row" style={{marginBottom:16}}>
              <div className="mini-metric"><div className="mini-metric-label" style={{color:"#22c55e"}}>🏆 Top (>10%)</div><div className="mini-metric-value">{audit.landing_pages?.top}</div></div>
              <div className="mini-metric"><div className="mini-metric-label" style={{color:"#f59e0b"}}>📊 Médias (3-10%)</div><div className="mini-metric-value">{audit.landing_pages?.average}</div></div>
              <div className="mini-metric"><div className="mini-metric-label" style={{color:"#ef4444"}}>🔴 Críticas (&lt;3%)</div><div className="mini-metric-value">{audit.landing_pages?.critical}</div></div>
              <div className="mini-metric"><div className="mini-metric-label" style={{color:"#94a3b8"}}>📝 N Publicadas</div><div className="mini-metric-value">{audit.landing_pages?.unpublished}</div></div>
            </div>

            {(audit.landing_pages?.critical_lps || []).length > 0 && (
              <>
                <div className="muted" style={{fontSize:12, marginBottom:8}}>LPs críticas que precisam de atenção:</div>
                {audit.landing_pages.critical_lps.map((lp, i) => (
                  <div className="status-box urgent" key={i} style={{marginBottom:8}}>
                    <div className="row">
                      <strong>{lp.name}</strong>
                      <span className="badge" style={{background:"#ef4444"}}>{lp.conversion_rate}% conversão</span>
                    </div>
                    <div className="muted" style={{fontSize:12}}>{lp.visits} visitas · {lp.conversions} conversões</div>
                    {lp.url && <div style={{marginTop:4}}><a href={lp.url} target="_blank" rel="noreferrer" style={{fontSize:12}}>{lp.url}</a></div>}
                  </div>
                ))}
              </>
            )}

            {(audit.landing_pages?.top_lps || []).length > 0 && (
              <>
                <div className="muted" style={{fontSize:12, marginBottom:8, marginTop:16}}>Top performers:</div>
                {audit.landing_pages.top_lps.map((lp, i) => (
                  <div className="status-box" key={i} style={{marginBottom:8, borderLeft:"3px solid #22c55e"}}>
                    <div className="row">
                      <strong>{lp.name}</strong>
                      <span className="badge" style={{background:"#22c55e"}}>{lp.conversion_rate}% conversão</span>
                    </div>
                    <div className="muted" style={{fontSize:12}}>{lp.visits} visitas · {lp.conversions} conversões</div>
                  </div>
                ))}
              </>
            )}
          </div>
        </>
      )}

      {!audit && !loading && (
        <div className="card" style={{textAlign:"center", padding:40, opacity:0.6}}>
          <div style={{fontSize:48, marginBottom:12}}>🩺</div>
          <div>Selecione um cliente e clique em <strong>Rodar Auditoria</strong> para ver o diagnóstico completo da conta.</div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [authed, setAuthed] = React.useState(false);
  const [section, setSection] = React.useState("dashboard");
  const [dashboard, setDashboard] = React.useState(null);
  const [globalError, setGlobalError] = React.useState("");
  const [checkingSession, setCheckingSession] = React.useState(true);

  async function validateSession() {
    try {
      const token = getToken();
      if (!token) {
        setAuthed(false);
        return false;
      }
      await api("/api/auth/me");
      setAuthed(true);
      return true;
    } catch (_e) {
      clearSession();
      setAuthed(false);
      return false;
    } finally {
      setCheckingSession(false);
    }
  }

  async function loadDashboard() {
    const d = await api("/api/agency/overview");
    setDashboard(d);
  }

  async function refreshAll() {
    try {
      setGlobalError("");
      await loadDashboard();
    } catch (e) {
      setGlobalError(e.message || "Erro ao atualizar dados");
    }
  }

  React.useEffect(() => {
    (async () => {
      const ok = await validateSession();
      if (ok) await refreshAll();
    })();
  }, []);

  function logout() {
    clearSession();
    setAuthed(false);
    setSection("dashboard");
  }

  if (checkingSession) {
    return <div style={{padding:40}}>Validando sessão...</div>;
  }

  if (!authed) {
    return <LoginPage onLogin={async () => {
      setAuthed(true);
      await refreshAll();
    }} />;
  }

  return (
    <div className="app">
      <Sidebar section={section} setSection={setSection} logout={logout} />

      <div className="main">
        {globalError && <div className="error-box">{globalError}</div>}

        {section === "dashboard" && <Dashboard data={dashboard} reload={refreshAll} />}
        {section === "clients" && <ClientsPanel reloadDashboard={refreshAll} />}
        {section === "portfolio" && <PortfolioPage data={dashboard} />}
        {section === "landing_pages" && <ModulePage moduleName="landing_pages" title="Landing Pages" description="Lista das landing pages sincronizadas por cliente." />}
        {section === "leads" && <ModulePage moduleName="leads" title="Leads" description="Lista dos leads sincronizados e salvos a partir das segmentações." />}
        {section === "segmentations" && <ModulePage moduleName="segmentations" title="Segmentações" description="Lista das segmentações sincronizadas por cliente." />}
        {section === "workflows" && <ModulePage moduleName="workflows" title="Workflows" description="Lista dos workflows sincronizados por cliente." />}
        {section === "campaigns" && <ModulePage moduleName="campaigns" title="Campanhas" description="Lista das campanhas sincronizadas por cliente." />}
        {section === "flow_studio" && <FlowStudio />}
        {section === "health_audit" && <HealthAudit />}
        {section === "prospect" && <Prospecting />}
        {section === "report" && <ExecutiveReport />}
        {section === "alerts" && <AlertsPanel />}
      </div>
    </div>
  );
}

const rootElement = document.getElementById("root");
if (ReactDOM.createRoot) {
  ReactDOM.createRoot(rootElement).render(<App />);
} else {
  ReactDOM.render(<App />, rootElement);
}
</script>
</body>
</html>
