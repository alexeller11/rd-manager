<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>RD Manager IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #12181f;
      --line: #1e2933;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #10b981;
      --green-soft: rgba(16, 185, 129, 0.1);
      --yellow: #f59e0b;
      --yellow-soft: rgba(245, 158, 11, 0.1);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.1);
      --blue: #3b82f6;
      --blue-soft: rgba(59, 130, 246, 0.1);
      --accent: #6366f1;
      --shadow: 0 10px 40px -10px rgba(0,0,0,0.5);
      --radius: 12px;
      --sidebar-width: 280px;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.05) 0, transparent 50%),
        radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.05) 0, transparent 50%);
      color: var(--text);
      overflow-x: hidden;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: var(--sidebar-width);
      background: rgba(11, 15, 19, 0.8);
      border-right: 1px solid var(--line);
      padding: 32px 20px;
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .brand {
      margin-bottom: 40px;
    }

    .brand h2 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .nav-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin: 24px 0 12px 12px;
      opacity: 0.6;
    }

    .sidebar button {
      width: 100%;
      margin-bottom: 4px;
      padding: 10px 14px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      text-align: left;
      cursor: pointer;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar button:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    .sidebar button.active {
      background: var(--green-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .main {
      flex: 1;
      padding: 40px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .hero {
      background: linear-gradient(135deg, var(--panel) 0%, #080b0f 100%);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 40px;
      margin-bottom: 32px;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 300px;
      height: 300px;
      background: var(--accent);
      filter: blur(120px);
      opacity: 0.1;
      pointer-events: none;
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      max-width: 700px;
      line-height: 1.6;
      font-size: 16px;
    }

    .card {
      background: var(--panel);
      padding: 24px;
      border-radius: var(--radius);
      margin-bottom: 24px;
      border: 1px solid var(--line);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      border-color: rgba(255,255,255,0.1);
    }

    .btn {
      background: var(--accent);
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      color: #000;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.1);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }

    .btn.secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .btn.blue {
      background: var(--blue);
      color: #fff;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error-box {
      background: var(--red-soft);
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 24px;
      color: #fca5a5;
      font-size: 14px;
      font-weight: 500;
    }

    .success-box {
      background: var(--green-soft);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 24px;
      color: #6ee7b7;
      font-size: 14px;
      font-weight: 500;
    }

    input, textarea, select {
      display: block;
      margin-bottom: 16px;
      padding: 12px 16px;
      width: 100%;
      max-width: 400px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #080b0f;
      color: white;
      font-family: inherit;
      font-size: 14px;
      transition: border-color 0.2s ease;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .kpi-card {
      background: var(--panel);
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }

    .kpi-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .kpi-value {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .badge.green { background: var(--green-soft); color: #34d399; }
    .badge.yellow { background: var(--yellow-soft); color: #fbbf24; }
    .badge.red { background: var(--red-soft); color: #f87171; }
    .badge.blue { background: var(--blue-soft); color: #60a5fa; }

    .ai-report {
      background: #080b0f;
      border-radius: 8px;
      padding: 20px;
      line-height: 1.6;
      font-size: 15px;
    }

    .ai-report h4 {
      color: var(--accent);
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 700;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .status-box, .table-row, .mini-metric {
      background: #080b0f;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin-top: 12px;
    }

    .two-col {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .metric-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .mini-metric-label, .muted, .list-line {
      color: var(--muted);
    }

    .mini-metric-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (max-width: 768px) {
      .app { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: relative; padding: 20px; }
      .main { padding: 20px; }
      .hero { padding: 24px; }
      .hero h1 { font-size: 28px; }
    }
  </style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const API = "";
const BUILD_TAG = "2026-04-18-v1.4-full-restored";
console.log("RD Manager IA build:", BUILD_TAG);

function getToken() {
  try { return localStorage.getItem("rd_manager_token"); } catch (_err) { return null; }
}
function saveSession(data) {
  try {
    if (data?.access_token) localStorage.setItem("rd_manager_token", data.access_token);
    if (data?.username) localStorage.setItem("rd_manager_username", data.username);
  } catch (_err) {}
}
function clearSession() {
  try {
    localStorage.removeItem("rd_manager_token");
    localStorage.removeItem("rd_manager_username");
  } catch (_err) {}
}
function normalizeAiReport(payload) {
  if (payload == null) return "";
  if (typeof payload === "string") return payload;
  try { return JSON.stringify(payload, null, 2); } catch (_err) { return String(payload); }
}
async function api(url, options = {}) {
  const token = getToken();
  const headers = {
    ...(options.body ? { "Content-Type": "application/json" } : {}),
    ...(token ? { Authorization: `Bearer ${token}` } : {}),
    ...(options.headers || {})
  };
  const res = await fetch(API + url, { ...options, headers });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) {
    if (!res.ok) throw new Error(text || "Erro do servidor");
    return text;
  }
  if (!res.ok) {
    const detail = data?.detail || text || "Erro do servidor";
    if (res.status === 401) clearSession();
    throw new Error(detail);
  }
  return data;
}

function Sidebar({ section, setSection, logout }) {
  return (
    <div className="sidebar">
      <div className="brand">
        <h2>RD Manager IA</h2>
        <p>Ferramenta de agência para score, risco, expansão, relatórios e módulos reais da RD.</p>
        <div style={{fontSize:"11px", color:"var(--blue)", marginTop:"10px", fontWeight:"bold"}}>
          BUILD {BUILD_TAG}
        </div>
      </div>

      <div className="nav-title">Operação</div>
      <button type="button" className={section==="dashboard"?"active":""} onClick={()=>setSection("dashboard")}>Dashboard</button>
      <button type="button" className={section==="clients"?"active":""} onClick={()=>setSection("clients")}>Clientes</button>
      <button type="button" className={section==="portfolio"?"active":""} onClick={()=>setSection("portfolio")}>Carteira Inteligente</button>

      <div className="nav-title">Módulos RD</div>
      <button type="button" className={section==="landing_pages"?"active":""} onClick={()=>setSection("landing_pages")}>Landing Pages</button>
      <button type="button" className={section==="leads"?"active":""} onClick={()=>setSection("leads")}>Leads</button>
      <button type="button" className={section==="segmentations"?"active":""} onClick={()=>setSection("segmentations")}>Segmentações</button>
      <button type="button" className={section==="workflows"?"active":""} onClick={()=>setSection("workflows")}>Workflows</button>
      <button type="button" className={section==="campaigns"?"active":""} onClick={()=>setSection("campaigns")}>Campanhas</button>
      <button type="button" className={section==="flow_studio"?"active":""} onClick={()=>setSection("flow_studio")}>Flow Studio IA</button>

      <div className="nav-title">Crescimento</div>
      <button type="button" className={section==="health_audit"?"active":""} onClick={()=>setSection("health_audit")}>Auditoria de Saúde</button>
      <button type="button" className={section==="prospect"?"active":""} onClick={()=>setSection("prospect")}>Prospecção</button>
      <button type="button" className={section==="report"?"active":""} onClick={()=>setSection("report")}>Relatório Executivo</button>
      <button type="button" className={section==="alerts"?"active":""} onClick={()=>setSection("alerts")}>Alertas</button>

      <div className="nav-title">Sessão</div>
      <button type="button" onClick={logout}>Sair</button>
    </div>
  );
}

function LoginPage({ onLogin }) {
  const [username, setUsername] = React.useState("admin");
  const [password, setPassword] = React.useState("");
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState("");

  async function submit(e) {
    e.preventDefault();
    try {
      setLoading(true);
      setError("");
      const body = new URLSearchParams();
      body.set("username", username);
      body.set("password", password);
      const loginRes = await fetch(API + "/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body.toString(),
      });
      const text = await loginRes.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch (_parseErr) { data = { detail: text || "Falha no login" }; }
      if (!loginRes.ok) throw new Error(data?.detail || "Falha no login");
      saveSession(data);
      onLogin();
    } catch (err) {
      setError(err.message || "Erro ao autenticar");
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="main" style={{maxWidth: 460, margin: "40px auto"}}>
      <div className="hero">
        <h1>RD Manager IA</h1>
        <p>Entre com usuário e senha para acessar o painel.</p>
      </div>
      <form className="card" onSubmit={submit}>
        {error && <div className="error-box">{error}</div>}
        <input value={username} onChange={(e) => setUsername(e.target.value)} placeholder="Usuário" />
        <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Senha" />
        <button className="btn" type="submit" disabled={loading}>{loading ? "Entrando..." : "Entrar"}</button>
      </form>
    </div>
  );
}

function ClientsPanel() {
  const [clients, setClients] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const [saving, setSaving] = React.useState(false);
  const [syncingId, setSyncingId] = React.useState(null);
  const [error, setError] = React.useState("");
  const [success, setSuccess] = React.useState("");
  const [form, setForm] = React.useState({ name: "", segment: "", website: "", description: "" });

  async function loadClients() {
    try {
      setLoading(true);
      setError("");
      const res = await api("/api/clients/");
      setClients(Array.isArray(res) ? res : []);
    } catch (e) {
      setError(e.message || "Erro ao carregar clientes");
    } finally {
      setLoading(false);
    }
  }

  React.useEffect(() => { loadClients(); }, []);

  async function createClient() {
    if (!form.name.trim()) {
      setError("Informe o nome do cliente.");
      return;
    }
    try {
      setSaving(true);
      setError("");
      setSuccess("");
      await api("/api/clients/", { method: "POST", body: JSON.stringify(form) });
      setForm({ name: "", segment: "", website: "", description: "" });
      setSuccess("Cliente adicionado com sucesso.");
      await loadClients();
    } catch (e) {
      setError(e.message || "Erro ao criar cliente");
    } finally {
      setSaving(false);
    }
  }

  async function syncClient(clientId) {
    try {
      setSyncingId(clientId);
      setError("");
      setSuccess("");
      await api(`/api/rdsync/run/${clientId}`, { method: "POST" });
      setSuccess("Sincronização executada com sucesso.");
      await loadClients();
    } catch (e) {
      setError(e.message || "Erro ao sincronizar cliente");
    } finally {
      setSyncingId(null);
    }
  }

  return (
    <div>
      <div className="hero">
        <h1>Clientes</h1>
        <p>Cadastre clientes, conecte RD e execute sincronização completa.</p>
      </div>

      {error && <div className="error-box">{error}</div>}
      {success && <div className="success-box">{success}</div>}

      <div className="card">
        <h3>Novo cliente</h3>
        <input placeholder="Nome" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} />
        <input placeholder="Segmento" value={form.segment} onChange={e => setForm({ ...form, segment: e.target.value })} />
        <input placeholder="Website" value={form.website} onChange={e => setForm({ ...form, website: e.target.value })} />
        <textarea placeholder="Descrição" value={form.description} onChange={e => setForm({ ...form, description: e.target.value })} />
        <button type="button" className="btn" onClick={createClient} disabled={saving}>{saving ? "Salvando..." : "Adicionar cliente"}</button>
      </div>

      <div className="card">
        <div className="row">
          <h3 style={{ margin: 0 }}>Carteira</h3>
          <button type="button" className="btn secondary" onClick={loadClients} disabled={loading}>{loading ? "Atualizando..." : "Atualizar"}</button>
        </div>

        {clients.length === 0 ? (
          <div className="muted" style={{ marginTop: 12 }}>Nenhum cliente cadastrado.</div>
        ) : clients.map((c) => (
          <div key={c.id} className="status-box" style={{ marginTop: 12 }}>
            <div className="row">
              <strong>{c.name}</strong>
              <span className={`badge ${c.rd_connected ? "green" : "red"}`}>{c.rd_connected ? "RD conectada" : "RD não conectada"}</span>
            </div>

            <div className="muted" style={{ marginTop: 8 }}>{c.segment || "Sem segmento"}{c.website ? ` • ${c.website}` : ""}</div>

            <div style={{ marginTop: 10, display: "flex", gap: 8, flexWrap: "wrap" }}>
              <a className="btn blue" href={`/oauth/authorize/${c.id}`}>Conectar RD</a>
              <button type="button" className="btn" onClick={() => syncClient(c.id)} disabled={syncingId === c.id || !c.rd_connected}>
                {syncingId === c.id ? "Sincronizando..." : "Sincronizar"}
              </button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function Dashboard() {
  return (
    <div>
      <div className="hero">
        <h1>Dashboard</h1>
        <p>Painel principal restaurado com os módulos navegáveis.</p>
      </div>
      <div className="kpi-grid">
        <div className="kpi-card"><div className="kpi-label">Frontend</div><div className="kpi-value">OK</div></div>
        <div className="kpi-card"><div className="kpi-label">Build</div><div className="kpi-value" style={{fontSize:18}}>v1.4</div></div>
      </div>
    </div>
  );
}

function ModulePage({ title, description, endpoint }) {
  const [clients, setClients] = React.useState([]);
  const [clientId, setClientId] = React.useState("");
  const [data, setData] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState("");

  React.useEffect(() => {
    api("/api/clients/").then(res => {
      const list = Array.isArray(res) ? res : [];
      setClients(list);
      if (list.length > 0) setClientId(String(list[0].id));
    }).catch(e => setError(e.message || "Erro ao carregar clientes"));
  }, []);

  async function loadModule() {
    if (!clientId) return;
    try {
      setLoading(true);
      setError("");
      const res = await api(endpoint.replace("{clientId}", clientId));
      setData(res);
    } catch (e) {
      setError(e.message || "Erro ao carregar módulo");
    } finally {
      setLoading(false);
    }
  }

  return (
    <div>
      <div className="hero">
        <h1>{title}</h1>
        <p>{description}</p>
      </div>

      {error && <div className="error-box">{error}</div>}

      <div className="card">
        <div className="row">
          <select value={clientId} onChange={(e) => setClientId(e.target.value)}>
            <option value="">Selecione um cliente</option>
            {clients.map((client) => <option key={client.id} value={client.id}>{client.name}</option>)}
          </select>
          <button type="button" className="btn" onClick={loadModule} disabled={!clientId || loading}>{loading ? "Carregando..." : "Carregar módulo"}</button>
        </div>
      </div>

      {data && (
        <div className="card">
          <h3>Resposta do módulo</h3>
          <pre>{JSON.stringify(data, null, 2)}</pre>
        </div>
      )}
    </div>
  );
}

function SimplePage({ title, description }) {
  return (
    <div>
      <div className="hero">
        <h1>{title}</h1>
        <p>{description}</p>
      </div>
      <div className="card">
        <p>Módulo visual restaurado.</p>
      </div>
    </div>
  );
}

function App() {
  const [section, setSection] = React.useState("dashboard");
  const [authenticated, setAuthenticated] = React.useState(!!getToken());

  function logout() {
    clearSession();
    setAuthenticated(false);
  }

  if (!authenticated) return <LoginPage onLogin={() => setAuthenticated(true)} />;

  let content = <Dashboard />;
  if (section === "clients") content = <ClientsPanel />;
  if (section === "portfolio") content = <SimplePage title="Carteira Inteligente" description="Painel visual restaurado." />;
  if (section === "landing_pages") content = <ModulePage title="Landing Pages" description="Carregue os dados sincronizados de landing pages." endpoint="/api/rd-modules/client/{clientId}/landing_pages?limit=100" />;
  if (section === "leads") content = <ModulePage title="Leads" description="Carregue os leads sincronizados da RD." endpoint="/api/rd-modules/client/{clientId}/leads?limit=100" />;
  if (section === "segmentations") content = <ModulePage title="Segmentações" description="Carregue as segmentações sincronizadas." endpoint="/api/rd-modules/client/{clientId}/segmentations?limit=100" />;
  if (section === "workflows") content = <ModulePage title="Workflows" description="Carregue os workflows sincronizados." endpoint="/api/rd-modules/client/{clientId}/workflows?limit=100" />;
  if (section === "campaigns") content = <ModulePage title="Campanhas" description="Carregue as campanhas sincronizadas." endpoint="/api/rd-modules/client/{clientId}/campaigns?limit=100" />;
  if (section === "flow_studio") content = <SimplePage title="Flow Studio IA" description="Tela visual restaurada." />;
  if (section === "health_audit") content = <SimplePage title="Auditoria de Saúde" description="Tela visual restaurada." />;
  if (section === "prospect") content = <SimplePage title="Prospecção" description="Tela visual restaurada." />;
  if (section === "report") content = <SimplePage title="Relatório Executivo" description="Tela visual restaurada." />;
  if (section === "alerts") content = <SimplePage title="Alertas" description="Tela visual restaurada." />;

  return <div className="app"><Sidebar section={section} setSection={setSection} logout={logout} /><main className="main">{content}</main></div>;
}

</script>
