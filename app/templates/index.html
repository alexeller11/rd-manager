<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RD Manager IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --ink: #0c0f14;
      --ink-2: #141920;
      --ink-3: #1a2230;
      --surface: #1e2840;
      --surface-2: #243050;
      --line: rgba(255,255,255,0.07);
      --line-2: rgba(255,255,255,0.12);
      --text: #f0f4ff;
      --text-2: #8fa3c8;
      --text-3: #5a6e90;
      --lime: #b8f54a;
      --lime-dim: rgba(184,245,74,0.12);
      --lime-dim2: rgba(184,245,74,0.06);
      --cyan: #4af5d4;
      --cyan-dim: rgba(74,245,212,0.1);
      --amber: #f5c84a;
      --amber-dim: rgba(245,200,74,0.1);
      --rose: #f54a7a;
      --rose-dim: rgba(245,74,122,0.1);
      --blue: #4a8ff5;
      --blue-dim: rgba(74,143,245,0.1);
      --r: 10px;
      --r-lg: 16px;
      --r-xl: 20px;
      --sidebar: 260px;
      --shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--ink);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .app { display: flex; min-height: 100vh; position: relative; z-index: 1; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar);
      background: var(--ink-2);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
      overflow-y: auto;
    }

    .sidebar-inner { padding: 28px 16px 24px; flex: 1; display: flex; flex-direction: column; }

    .brand { padding: 0 8px; margin-bottom: 32px; }

    .brand-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }

    .brand-icon {
      width: 36px; height: 36px;
      background: var(--lime);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 14px;
      color: var(--ink);
      letter-spacing: -0.03em;
      flex-shrink: 0;
    }

    .brand-name {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .brand-sub { font-size: 11px; color: var(--text-3); padding-left: 46px; letter-spacing: 0.02em; }

    .nav-section { margin-bottom: 4px; }

    .nav-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-3);
      padding: 16px 12px 6px;
    }

    .nav-btn {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-2);
      padding: 8px 12px;
      border-radius: var(--r);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 400;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 9px;
      transition: background 0.15s, color 0.15s;
      position: relative;
    }

    .nav-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }

    .nav-btn.active { background: var(--lime-dim); color: var(--lime); font-weight: 500; }

    .nav-btn.active::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 3px;
      background: var(--lime);
      border-radius: 0 3px 3px 0;
    }

    .nav-icon { width: 16px; height: 16px; opacity: 0.7; flex-shrink: 0; }
    .nav-btn.active .nav-icon { opacity: 1; }

    .sidebar-footer { padding: 16px; border-top: 1px solid var(--line); margin-top: auto; }

    .logout-btn {
      width: 100%;
      background: transparent;
      border: 1px solid var(--line-2);
      color: var(--text-3);
      padding: 8px 12px;
      border-radius: var(--r);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }

    .logout-btn:hover { border-color: var(--rose); color: var(--rose); background: var(--rose-dim); }

    /* ── MAIN ── */
    .main { margin-left: var(--sidebar); flex: 1; padding: 40px 48px; min-height: 100vh; }

    /* ── PAGE HEADER ── */
    .page-header { margin-bottom: 32px; }

    .page-eyebrow {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--lime);
      margin-bottom: 8px;
    }

    .page-title {
      font-family: 'Syne', sans-serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .page-sub { font-size: 14px; color: var(--text-2); line-height: 1.5; }

    /* ── CARDS ── */
    .card {
      background: var(--ink-2);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 24px;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }

    .card:hover { border-color: var(--line-2); }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }

    /* ── KPI GRID ── */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }

    .kpi-card {
      background: var(--ink-2);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 22px 24px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }

    .kpi-card:hover { border-color: var(--line-2); transform: translateY(-1px); }

    .kpi-card::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 80px; height: 80px;
      border-radius: 50%;
      filter: blur(30px);
      opacity: 0.15;
    }

    .kpi-card.lime::after { background: var(--lime); }
    .kpi-card.cyan::after { background: var(--cyan); }
    .kpi-card.amber::after { background: var(--amber); }
    .kpi-card.rose::after { background: var(--rose); }

    .kpi-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-3); margin-bottom: 10px; }

    .kpi-value { font-family: 'Syne', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.04em; color: var(--text); line-height: 1; }

    .kpi-change { font-size: 12px; margin-top: 6px; font-weight: 500; }
    .kpi-change.up { color: var(--lime); }
    .kpi-change.down { color: var(--rose); }
    .kpi-change.neutral { color: var(--text-3); }

    /* ── BADGES ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .badge.lime { background: var(--lime-dim); color: var(--lime); border: 1px solid rgba(184,245,74,0.2); }
    .badge.cyan { background: var(--cyan-dim); color: var(--cyan); border: 1px solid rgba(74,245,212,0.2); }
    .badge.amber { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(245,200,74,0.2); }
    .badge.rose { background: var(--rose-dim); color: var(--rose); border: 1px solid rgba(245,74,122,0.2); }
    .badge.blue { background: var(--blue-dim); color: var(--blue); border: 1px solid rgba(74,143,245,0.2); }
    .badge.gray { background: rgba(255,255,255,0.06); color: var(--text-2); border: 1px solid var(--line); }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 18px;
      border-radius: var(--r);
      font-family: 'DM Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-primary { background: var(--lime); color: var(--ink); }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }

    .btn-secondary { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--line-2); }
    .btn-secondary:hover:not(:disabled) { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.18); }

    .btn-ghost { background: transparent; color: var(--text-2); border: 1px solid var(--line); }
    .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.04); color: var(--text); }

    .btn-danger { background: var(--rose-dim); color: var(--rose); border: 1px solid rgba(245,74,122,0.2); }
    .btn-danger:hover:not(:disabled) { background: rgba(245,74,122,0.2); }

    .btn-blue { background: var(--blue); color: #fff; }
    .btn-blue:hover:not(:disabled) { filter: brightness(1.1); }

    .btn-cyan { background: var(--cyan-dim); color: var(--cyan); border: 1px solid rgba(74,245,212,0.2); }
    .btn-cyan:hover:not(:disabled) { background: rgba(74,245,212,0.18); }

    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    /* ── FORMS ── */
    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-2);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    input, textarea, select {
      width: 100%;
      max-width: 480px;
      padding: 10px 14px;
      background: var(--ink);
      border: 1px solid var(--line-2);
      border-radius: var(--r);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-appearance: none;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--lime);
      box-shadow: 0 0 0 3px var(--lime-dim2);
    }

    textarea { resize: vertical; min-height: 80px; }
    select option { background: var(--ink-2); }

    /* ── ALERTS ── */
    .alert {
      padding: 14px 18px;
      border-radius: var(--r);
      font-size: 13.5px;
      font-weight: 500;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .alert-error { background: var(--rose-dim); border: 1px solid rgba(245,74,122,0.25); color: #ffb3c8; }
    .alert-success { background: var(--lime-dim); border: 1px solid rgba(184,245,74,0.25); color: var(--lime); }
    .alert-info { background: var(--blue-dim); border: 1px solid rgba(74,143,245,0.25); color: #9dc8ff; }

    /* ── CLIENT CARD ── */
    .client-item {
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 20px 24px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: border-color 0.2s, background 0.2s;
    }

    .client-item:hover { border-color: var(--line-2); background: var(--ink-2); }

    .client-avatar {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--lime-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--lime);
      flex-shrink: 0;
    }

    .client-info { flex: 1; min-width: 0; }

    .client-name { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .client-meta { font-size: 12px; color: var(--text-3); }

    .client-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

    /* ── AI RESULT ── */
    .ai-result {
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 28px;
      font-size: 14px;
      line-height: 1.75;
      color: var(--text-2);
    }

    .ai-result h1, .ai-result h2, .ai-result h3 {
      font-family: 'Syne', sans-serif;
      color: var(--text);
      margin: 24px 0 10px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .ai-result h1 { font-size: 22px; margin-top: 0; }
    .ai-result h2 { font-size: 17px; color: var(--lime); }
    .ai-result h3 { font-size: 15px; }
    .ai-result p { margin-bottom: 12px; }
    .ai-result ul, .ai-result ol { padding-left: 20px; margin-bottom: 12px; }
    .ai-result li { margin-bottom: 6px; }
    .ai-result strong { color: var(--text); font-weight: 600; }
    .ai-result code { background: rgba(184,245,74,0.1); color: var(--lime); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    .ai-result hr { border: none; border-top: 1px solid var(--line); margin: 20px 0; }

    /* ── MODULE ITEMS ── */
    .module-item {
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 14px 18px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13.5px;
      transition: border-color 0.15s;
    }

    .module-item:hover { border-color: var(--line-2); }

    .module-item-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .module-item-info { flex: 1; min-width: 0; }
    .module-item-name { font-weight: 500; color: var(--text); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .module-item-meta { font-size: 12px; color: var(--text-3); }

    /* ── SCORE BAR ── */
    .score-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.06); border-radius: 99px; overflow: hidden; }
    .score-bar-fill { height: 100%; border-radius: 99px; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }

    /* ── SPINNER ── */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: var(--lime);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── EMPTY STATE ── */
    .empty { text-align: center; padding: 60px 40px; color: var(--text-3); }
    .empty-icon { font-size: 40px; margin-bottom: 16px; opacity: 0.4; }
    .empty-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 600; color: var(--text-2); margin-bottom: 8px; }
    .empty p { font-size: 13.5px; max-width: 320px; margin: 0 auto; }

    /* ── GRID LAYOUTS ── */
    .two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
    .three-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

    /* ── LOGIN ── */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; position: relative; z-index: 1; }

    .login-card { background: var(--ink-2); border: 1px solid var(--line); border-radius: 24px; padding: 48px; width: 100%; max-width: 420px; box-shadow: var(--shadow); }

    .login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; }

    .login-logo-icon { width: 48px; height: 48px; background: var(--lime); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px; color: var(--ink); }

    .login-logo-text { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }

    .login-card h2 { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 6px; }
    .login-card p { font-size: 14px; color: var(--text-2); margin-bottom: 28px; }
    .login-card input { max-width: 100%; margin-bottom: 12px; }

    /* ── STAT ROW ── */
    .stat-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { flex: 1; font-size: 13.5px; color: var(--text-2); }
    .stat-value { font-weight: 600; font-size: 14px; color: var(--text); }

    /* ── PILL TABS ── */
    .pill-tabs { display: flex; gap: 6px; background: var(--ink); border: 1px solid var(--line); border-radius: 99px; padding: 4px; margin-bottom: 24px; flex-wrap: wrap; }

    .pill-tab { background: transparent; border: none; padding: 7px 16px; border-radius: 99px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: var(--text-3); transition: all 0.15s; }
    .pill-tab.active { background: var(--lime); color: var(--ink); font-weight: 600; }
    .pill-tab:not(.active):hover { color: var(--text); background: rgba(255,255,255,0.05); }

    /* ── SCROLLABLE LIST ── */
    .scroll-list { max-height: 480px; overflow-y: auto; }
    .scroll-list::-webkit-scrollbar { width: 4px; }
    .scroll-list::-webkit-scrollbar-track { background: transparent; }
    .scroll-list::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }

    /* ── FILTER BAR ── */
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .filter-chip { background: var(--ink); border: 1px solid var(--line); color: var(--text-3); padding: 5px 14px; border-radius: 99px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
    .filter-chip:hover { border-color: var(--line-2); color: var(--text); }
    .filter-chip.active { background: var(--lime-dim); border-color: rgba(184,245,74,0.3); color: var(--lime); }

    /* ── FLOW CANVAS (RD Station style) ── */
    .flow-canvas {
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 24px;
      overflow-x: auto;
      min-height: 300px;
    }

    .flow-timeline {
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
    }

    .flow-timeline::before {
      content: '';
      position: absolute;
      left: 28px;
      top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, var(--lime), rgba(184,245,74,0.1));
    }

    .flow-step {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 12px 0;
      position: relative;
    }

    .flow-step-dot {
      width: 20px; height: 20px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      margin-left: 19px;
      z-index: 1;
      margin-top: 3px;
    }

    .flow-step-dot.trigger { background: var(--lime); color: var(--ink); }
    .flow-step-dot.email { background: var(--blue); color: #fff; }
    .flow-step-dot.wait { background: var(--amber-dim); border: 2px solid var(--amber); color: var(--amber); }
    .flow-step-dot.condition { background: var(--cyan-dim); border: 2px solid var(--cyan); color: var(--cyan); transform: rotate(45deg); border-radius: 4px; }
    .flow-step-dot.action { background: var(--rose-dim); border: 2px solid var(--rose); color: var(--rose); }
    .flow-step-dot.end { background: rgba(255,255,255,0.1); border: 2px solid var(--line-2); color: var(--text-3); }

    .flow-step-content {
      flex: 1;
      background: var(--ink-2);
      border: 1px solid var(--line);
      border-radius: var(--r);

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;
const API = "";

/* ── AUTH ── */
const getToken = () => { try { return localStorage.getItem("rdm_token"); } catch { return null; } };
const setToken = (t) => { try { localStorage.setItem("rdm_token", t); } catch {} };
const clearToken = () => { try { localStorage.removeItem("rdm_token"); } catch {} };

async function api(url, opts = {}) {
  const token = getToken();
  const headers = {
    ...(opts.body ? { "Content-Type": "application/json" } : {}),
    ...(token ? { Authorization: `Bearer ${token}` } : {}),
    ...(opts.headers || {}),
  };
  const res = await fetch(API + url, { ...opts, headers });
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) {
    if (res.status === 401) clearToken();
    throw new Error((data?.detail) || String(data) || "Erro do servidor");
  }
  return data;
}

/* ── MARKDOWN RENDERER ── */
function renderMd(text) {
  if (!text) return "";
  return text
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^#### (.+)$/gm, '<strong>$1</strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^---$/gm, '<hr/>')
    .replace(/^[\-\*] (.+)$/gm, '<li>$1</li>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/^(?!<[hup]|<li|<hr)(.+)$/gm, '<p>$1</p>');
}

  copy: <svg style={{width:14,height:14}} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="4" y="4" width="9" height="11" rx="1.5"/><path d="M4 4V3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h1"/></svg>,
  link: <svg style={{width:13,height:13}} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M6 8a3 3 0 0 0 4.5 0l2-2a3 3 0 0 0-4.5-4L7 3M10 8a3 3 0 0 0-4.5 0l-2 2a3 3 0 0 0 4.5 4L9 13"/></svg>,

/* ── SHARED COMPONENTS ── */

function Spinner({ size = 16 }) {
  return <div className="spinner" style={{width:size,height:size}} />;
}

function Alert({ type="error", children }) {
  return <div className={`alert alert-${type}`}>{children}</div>;
}

function CopyBtn({ text }) {
  const [copied, setCopied] = useState(false);
  function copy() {
    navigator.clipboard?.writeText(text).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1500); });
  }
  return <button className="btn btn-ghost btn-sm" onClick={copy}>{icons.copy} {copied ? "Copiado!" : "Copiar"}</button>;
}

function AiResultBlock({ result, title="Análise da IA" }) {
  if (!result) return null;
  return (
    <div className="ai-panel">

        <span className="ai-badge">✦ IA</span>
        <span style={{fontSize:13,fontWeight:600,color:"var(--text)"}}>{title}</span>
        <div style={{marginLeft:"auto"}}><CopyBtn text={result} /></div>
      </div>
      <div className="ai-result md" dangerouslySetInnerHTML={{__html: renderMd(result)}} />
    </div>
  );
}

function BarMetric({ label, value, max=100, color="var(--lime)" }) {
  const pct = Math.min(100, Math.round((value/max)*100));
  return (
    <div style={{marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
        <span style={{fontSize:12,color:"var(--text-3)"}}>{label}</span>

      </div>
      <div className="score-bar">
        <div className="score-bar-fill" style={{width:`${pct}%`,background:color}} />
      </div>
    </div>
  );
}

function FilterChip({ label, active, onClick }) {

/* ── LOGIN ── */
function LoginPage({ onLogin }) {
  const [user, setUser] = useState("admin");
  const [pass, setPass] = useState("");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  async function submit(e) {
    e.preventDefault();
    setLoading(true); setErr("");
    try {
      const body = new URLSearchParams({ username: user, password: pass });
      const res = await fetch(API + "/api/auth/login", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body.toString() });
      const data = await res.json();
      if (!res.ok) throw new Error(data?.detail || "Falha no login");
      setToken(data.access_token);
      onLogin();
    } catch (e) { setErr(e.message); }
    finally { setLoading(false); }
  }

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-logo">
          <div className="login-logo-icon">RD</div>
          <span className="login-logo-text">RD Manager IA</span>
        </div>
        <h2>Bem-vindo de volta</h2>
        <p>Acesse sua conta para gerenciar sua agência.</p>
        {err && <Alert type="error">{err}</Alert>}
        <form onSubmit={submit}>
          <div className="field"><label>Usuário</label><input value={user} onChange={e=>setUser(e.target.value)} placeholder="admin" autoFocus /></div>
          <div className="field"><label>Senha</label><input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" /></div>
          <button type="submit" className="btn btn-primary" style={{width:"100%",justifyContent:"center",marginTop:8}} disabled={loading}>
            {loading ? <><Spinner/> Entrando...</> : "Entrar"}
          </button>
        </form>
      </div>
    </div>
  );
}

/* ── DASHBOARD ── */
function Dashboard() {
  const [stats, setStats] = useState(null);
  const [overview, setOverview] = useState(null);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");

  useEffect(() => {
    Promise.all([
      api("/api/agency/stats").catch(() => null),
      api("/api/agency/overview").catch(() => null),
    ]).then(([s, o]) => { setStats(s); setOverview(o); setLoading(false); })
      .catch(e => { setErr(e.message); setLoading(false); });
  }, []);

  if (loading) return <div style={{padding:80,textAlign:"center"}}><Spinner size={32}/></div>;

  const s = stats || {};
  const o = overview || {};
  const totals = o.totals || {};
  const ranking = o.ranking || [];
  const alerts = o.alerts || [];

  return (
    <div>
      <div className="page-header">
        <div className="page-eyebrow">Visão Geral</div>
        <h1 className="page-title">Dashboard da Agência</h1>
        <p className="page-sub">Métricas consolidadas de todos os clientes gerenciados.</p>
      </div>
      {err && <Alert type="error">{err}</Alert>}
      <div className="kpi-grid">
        <div className="kpi-card lime"><div className="kpi-label">Clientes ativos</div><div className="kpi-value">{s.total_clients ?? totals.total_clients ?? "—"}</div><div className="kpi-change neutral">{s.synced_clients ?? 0} com sync</div></div>
        <div className="kpi-card cyan"><div className="kpi-label">Total de leads</div><div className="kpi-value">{(s.total_leads ?? totals.total_leads ?? 0).toLocaleString("pt-BR")}</div><div className="kpi-change neutral">Monitorados ativos</div></div>
        <div className="kpi-card amber"><div className="kpi-label">Score médio</div><div className="kpi-value">{Math.round(s.avg_health_score ?? totals.avg_health_score ?? 0)}<span style={{fontSize:18,opacity:0.5}}>/100</span></div><div className="kpi-change neutral">Saúde da carteira</div></div>
        <div className="kpi-card rose"><div className="kpi-label">Clientes críticos</div><div className="kpi-value" style={{color:"var(--rose)"}}>{s.critical_clients ?? alerts.length ?? 0}</div><div className="kpi-change down">Precisam de atenção</div></div>
      </div>
      <div className="two-col">
        <div className="card">
          <div className="card-title">Ranking de Clientes</div>
          {ranking.length === 0 ? (
            <div className="empty"><div className="empty-icon">📊</div><div className="empty-title">Sem dados</div><p>Sincronize clientes para ver o ranking.</p></div>
          ) : ranking.slice(0,8).map((c,i) => {
            const color = c.health_score >= 75 ? "var(--lime)" : c.health_score >= 50 ? "var(--amber)" : "var(--rose)";
            return (
              <div key={c.client_id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderBottom:"1px solid var(--line)"}}>
                <span style={{fontSize:11,color:"var(--text-3)",width:20,textAlign:"right"}}>{i+1}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:13.5,fontWeight:600,color:"var(--text)",marginBottom:4}}>{c.name}</div>
                  <BarMetric label="" value={c.health_score} color={color} />
                </div>
                <span style={{fontSize:13,fontWeight:700,color,width:40,textAlign:"right"}}>{c.health_score}</span>
              </div>
            );
          })}
        </div>
        <div className="card">
          <div className="card-title">Métricas da Carteira</div>
          {[["Taxa de abertura média", `${totals.avg_open_rate ?? 0}%`],["Taxa de clique média", `${totals.avg_click_rate ?? 0}%`],["Total de campanhas", totals.total_campaigns ?? 0],["Total de conversões", totals.total_conversions ?? 0]].map(([l,v]) => (
            <div key={l} className="stat-row"><span className="stat-label">{l}</span><span className="stat-value">{v}</span></div>
          ))}
          {alerts.length > 0 && (
            <div style={{marginTop:20}}>
              <div style={{fontSize:12,fontWeight:600,color:"var(--rose)",marginBottom:10,textTransform:"uppercase",letterSpacing:"0.08em"}}>⚠ Clientes em alerta</div>
              {alerts.slice(0,4).map(a => (
                <div key={a.client_id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:"var(--rose-dim)",borderRadius:8,marginBottom:6,border:"1px solid rgba(245,74,122,0.15)"}}>
                  <span style={{fontSize:13.5,color:"var(--rose)",fontWeight:600}}>{a.name}</span>
                  <span className="badge rose" style={{marginLeft:"auto"}}>score {a.health_score}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── CLIENTS ── */
function ClientsPanel() {
  const [clients, setClients] = useState([]);
  const [loading, setLoading] = useState(false);
  const [saving, setSaving] = useState(false);
  const [syncingId, setSyncingId] = useState(null);
  const [err, setErr] = useState("");
  const [ok, setOk] = useState("");
  const [form, setForm] = useState({ name:"", segment:"", website:"", description:"" });
  const [showForm, setShowForm] = useState(false);

  const load = useCallback(async () => {
    setLoading(true); setErr("");
    try { setClients(await api("/api/clients/") || []); }
    catch(e) { setErr(e.message); }
    finally { setLoading(false); }
  }, []);

  useEffect(() => { load(); }, [load]);

  async function create(e) {
    e.preventDefault();
    if (!form.name.trim()) { setErr("Informe o nome."); return; }
    setSaving(true); setErr(""); setOk("");
    try {
      await api("/api/clients/", { method:"POST", body: JSON.stringify(form) });
      setForm({ name:"", segment:"", website:"", description:"" });
      setOk("Cliente adicionado!"); setShowForm(false);
      await load();
    } catch(e) { setErr(e.message); }
    finally { setSaving(false); }
  }

  async function sync(id) {
    setSyncingId(id); setErr(""); setOk("");
    try { await api(`/api/rdsync/run/${id}`, { method:"POST" }); setOk("Sync executado!"); await load(); }
    catch(e) { setErr(e.message); }
    finally { setSyncingId(null); }
  }

  const initials = (name) => name?.split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase() || "??";

  return (
    <div>
      <div className="page-header">
        <div className="page-eyebrow">Gestão</div>
        <h1 className="page-title">Clientes</h1>
        <p className="page-sub">Cadastre, conecte ao RD Station e sincronize dados da sua carteira.</p>
      </div>
      {err && <Alert type="error">{err}</Alert>}
      {ok && <Alert type="success">{ok}</Alert>}
      <div className="row-between" style={{marginBottom:20}}>
        <div className="row">
          <button className="btn btn-primary" onClick={()=>setShowForm(!showForm)}>{icons.add} Novo cliente</button>
          <button className="btn btn-secondary" onClick={load} disabled={loading}>{loading ? <Spinner/> : icons.refresh} Atualizar</button>
        </div>
        <span style={{fontSize:13,color:"var(--text-3)"}}>{clients.length} cliente{clients.length!==1?"s":""}</span>
      </div>
      {showForm && (
        <div className="card" style={{marginBottom:24,borderColor:"rgba(184,245,74,0.2)"}}>
          <div className="card-title">{icons.add} Adicionar novo cliente</div>
          <form onSubmit={create}>
            <div className="two-col">
              <div>

        <div className="card">
          <div className="card-title">Carteira ({clients.length})</div>
          {clients.map(c => (
            <div key={c.id} className="client-item">
              <div className="client-avatar">{initials(c.name)}</div>
              <div className="client-info">
                <div className="client-name">{c.name}</div>
                <div className="client-meta">{c.segment && <span>{c.segment}</span>}{c.website && <span> · {c.website}</span>}</div>
              </div>
              <div className="client-actions">
                <span className={`badge ${c.rd_connected?"lime":"gray"}`}>{c.rd_connected ? "RD conectada" : "Sem RD"}</span>
                <a href={`/oauth/authorize/${c.id}`} className="btn btn-blue btn-sm">{icons.connect} Conectar RD</a>
                <button className="btn btn-secondary btn-sm" onClick={()=>sync(c.id)} disabled={syncingId===c.id || !c.rd_connected}>{syncingId===c.id ? <Spinner/> : icons.sync} Sync</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── PORTFOLIO ── */
function Portfolio() {

  const [err, setErr] = useState("");
  const [tab, setTab] = useState("all");

  useEffect(() => {
    api("/api/agency/overview").then(d => { setData(d); setLoading(false); }).catch(e => { setErr(e.message); setLoading(false); });

  const portfolio = data?.portfolio || {};

  const allClients = [...(portfolio.at_risk||[]), ...(portfolio.expansion||[]), ...(portfolio.maintenance||[])];

            <div key={k} className="kpi-card" style={{cursor:"pointer",borderColor:tab===k?`var(--${c})`:"var(--line)"}} onClick={()=>setTab(k)}>

          const color = c.score >= 75 ? "var(--lime)" : c.score >= 50 ? "var(--amber)" : "var(--rose)";

/* ══════════════════════════════════════════════
   LANDING PAGES — com link + análise SEO/GEO IA
══════════════════════════════════════════════ */
function LandingPages() {
  const [clients, setClients] = useState([]);
  const [clientId, setClientId] = useState("");
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const [analyzingId, setAnalyzingId] = useState(null);
  const [aiResults, setAiResults] = useState({});

  useEffect(() => {
    api("/api/clients/").then(res => {
      const l = Array.isArray(res)?res:[];
      setClients(l);
      if(l.length) setClientId(String(l[0].id));
    }).catch(e => setErr(e.message));
  }, []);

  async function load() {
    if (!clientId) return;
    setLoading(true); setErr(""); setItems([]);
    try {
      const d = await api(`/api/rd-modules/client/${clientId}/landing_pages?limit=100`);
      setItems(d?.data?.items || d?.items || []);
    } catch(e) { setErr(e.message); }
    finally { setLoading(false); }
  }

  async function analyzeLp(item, idx) {
    const p = item?.payload || {};
    const url = p.url || p.public_url || p.page_url || "";
    if (!url) {
      setAiResults(prev => ({...prev, [idx]: "❌ Esta landing page não tem URL pública disponível para análise."}));
      return;
    }
    setAnalyzingId(idx);
    try {
      // First try the seo-geo endpoint, fallback to landing-pages analyze
      let result;
      try {
        const d = await api(`/api/seo-geo/client/${clientId}/landing-pages`);
        // find matching lp
        const found = d?.data?.landing_page_audits?.find(a => a.url === url);
        if (found?.audit) {
          const a = found.audit;
          result = `## SEO Score: ${a.seo_score}/100 | GEO Score: ${a.geo_score}/100\n\n**Title:** ${a.title || "Não encontrado"}\n\n**H1:** ${a.h1s?.[0] || "Não encontrado"}\n\n**Meta Description:** ${a.meta_description || "Ausente"}\n\n### Problemas SEO\n${(a.seo_notes||[]).map(n=>`- ${n}`).join("\n") || "- Nenhum"}\n\n### Problemas GEO (IA Search)\n${(a.geo_notes||[]).map(n=>`- ${n}`).join("\n") || "- Nenhum"}\n\n### Quick Wins\n${(a.quick_wins||[]).map(n=>`- ${n}`).join("\n") || "- Nenhum"}`;
        }
      } catch {}
      if (!result) {
        const d = await api("/api/landing-pages/analyze", { method:"POST", body: JSON.stringify({ url }) });
        result = d?.analysis || "Análise concluída sem retorno.";
      }
      setAiResults(prev => ({...prev, [idx]: result}));
    } catch(e) {
      setAiResults(prev => ({...prev, [idx]: `Erro: ${e.message}`}));
    } finally { setAnalyzingId(null); }
  }

  const lpUrl = (p) => p.url || p.public_url || p.page_url || "";

  return (
    <div>
      <div className="page-header">
        <div className="page-eyebrow">Módulos RD</div>
        <h1 className="page-title">Landing Pages</h1>
        <p className="page-sub">Landing pages sincronizadas do RD Station. Analise performance e identifique oportunidades de melhoria.</p>
      </div>
      {err && <Alert type="error">{err}</Alert>}
      <div className="card">
        <div className="row">
          <ClientSelect value={clientId} onChange={setClientId} clients={clients} />
          <button className="btn btn-primary" onClick={load} disabled={!clientId||loading}>
            {loading ? <><Spinner/>Carregando...</> : "Carregar dados"}
          </button>
        </div>
      </div>

      {items.length > 0 && (
        <div className="card">
          <div className="row-between" style={{marginBottom:16}}>
            <div className="card-title" style={{margin:0}}>{items.length} landing pages encontradas</div>
            <span className="badge lime">sincronizado</span>
          </div>
          <div className="scroll-list">
            {items.map((item, i) => {
              const p = item?.payload || {};
              const rate = parseFloat(p.conversion_rate || 0);
              const rateDisplay = rate > 1 ? rate : rate * 100;
              const rateColor = rateDisplay >= 10 ? "var(--lime)" : rateDisplay >= 3 ? "var(--amber)" : rateDisplay > 0 ? "var(--rose)" : "var(--text-3)";
              const url = lpUrl(p);
              const isPublished = !(p.status || "").toLowerCase().includes("not_published");
              const aiResult = aiResults[i];
              const isAnalyzing = analyzingId === i;

              return (
                <div key={i}>
                  <div className="module-item" style={{flexWrap:"wrap",gap:12,alignItems:"flex-start"}}>
                    <div className="module-item-icon" style={{background:"var(--blue-dim)"}}>🔗</div>
                    <div className="module-item-info" style={{minWidth:200}}>
                      <div className="module-item-name">{p.name || p.title || `LP ${i+1}`}</div>
                      <div className="module-item-meta" style={{display:"flex",gap:8,alignItems:"center",marginTop:4,flexWrap:"wrap"}}>
                        <span className={`badge ${isPublished?"lime":"gray"}`}>{isPublished ? "PUBLISHED" : "NOT_PUBLISHED"}</span>
                        {p.visits_count > 0 && <span>{p.visits_count?.toLocaleString("pt-BR")} visitas</span>}
                        {p.conversions_count > 0 && <span>· {p.conversions_count} conversões</span>}
                      </div>
                      {url && (
                        <div style={{marginTop:6}}>
                          <a href={url} target="_blank" rel="noopener noreferrer"
                            style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:11,color:"var(--blue)",textDecoration:"none",background:"var(--blue-dim)",padding:"3px 10px",borderRadius:99,border:"1px solid rgba(74,143,245,0.2)"}}>
                            {icons.link} {url.length > 50 ? url.slice(0,47)+"..." : url}
                          </a>
                        </div>
                      )}
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:10,flexShrink:0,marginLeft:"auto"}}>
                      {rateDisplay > 0 && (
                        <div style={{textAlign:"right"}}>
                          <div style={{fontFamily:"Syne",fontSize:18,fontWeight:700,color:rateColor}}>{rateDisplay.toFixed(1)}%</div>
                          <div style={{fontSize:10,color:"var(--text-3)"}}>conversão</div>
                        </div>
                      )}
                      <button
                        className="btn btn-cyan btn-sm"
                        onClick={() => analyzeLp(item, i)}
                        disabled={isAnalyzing}
                        title="Análise SEO + GEO com IA"
                      >
                        {isAnalyzing ? <Spinner/> : icons.ai}
                        {isAnalyzing ? "Analisando..." : "SEO + GEO IA"}
                      </button>
                    </div>
                  </div>
                  {aiResult && (
                    <div style={{marginBottom:16,marginLeft:44}}>
                      <AiResultBlock result={aiResult} title={`Análise SEO/GEO — ${p.name || p.title || "LP"}`} />
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════
   LEADS — com filtros por status, fonte e score
══════════════════════════════════════════════ */
function Leads() {
  const [clients, setClients] = useState([]);
  const [clientId, setClientId] = useState("");
  const [allItems, setAllItems] = useState([]);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const [filterStage, setFilterStage] = useState("all");
  const [filterSource, setFilterSource] = useState("all");
  const [filterScore, setFilterScore] = useState("all");
  const [search, setSearch] = useState("");
  const [aiAnalysis, setAiAnalysis] = useState(null);
  const [aiLoading, setAiLoading] = useState(false);

  useEffect(() => {
    api("/api/clients/").then(res => {
      const l = Array.isArray(res)?res:[];
      setClients(l);
      if(l.length) setClientId(String(l[0].id));
    });
  }, []);

  async function load() {
    if (!clientId) return;
    setLoading(true); setErr(""); setAllItems([]); setAiAnalysis(null);
    try {
      const d = await api(`/api/rd-modules/client/${clientId}/leads?limit=200`);
      setAllItems(d?.data?.items || d?.items || []);
    } catch(e) { setErr(e.message); }
    finally { setLoading(false); }
  }

  async function analyzeLeads() {
    setAiLoading(true);
    try {
      const sources = {};
      const stages = {};
      allItems.forEach(item => {
        const p = item?.payload || {};
        const src = p.traffic_source || p.utm_source || "orgânico";
        const stg = p.lifecycle_stage || p.stage || "indefinido";
        sources[src] = (sources[src]||0)+1;
        stages[stg] = (stages[stg]||0)+1;
      });
      const client = clients.find(c=>String(c.id)===clientId);
      const d = await api("/api/leads/analyze-base", {
        method:"POST",
        body: JSON.stringify({
          client_name: client?.name || "",
          total_leads: allItems.length,
          sources, segments: Object.keys(stages),
          engagement_rate: Math.round(filteredItems.length/Math.max(allItems.length,1)*100),
        })
      });
      setAiAnalysis(d?.analysis);
    } catch(e) { setErr(e.message); }
    finally { setAiLoading(false); }
  }

  const stages = [...new Set(allItems.map(i => (i?.payload?.lifecycle_stage || i?.payload?.stage || "indefinido")))];
  const sources = [...new Set(allItems.map(i => (i?.payload?.traffic_source || i?.payload?.utm_source || "orgânico")))];

  const filteredItems = allItems.filter(item => {
    const p = item?.payload || {};
    const stage = p.lifecycle_stage || p.stage || "indefinido";
    const source = p.traffic_source || p.utm_source || "orgânico";
    const email = p.email || "";
    const name = p.name || "";
    if (filterStage !== "all" && stage !== filterStage) return false;
    if (filterSource !== "all" && source !== filterSource) return false;
    if (filterScore === "hot" && (p.last_conversion_date ? false : true)) return false;
    if (search && !email.includes(search) && !name.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  const stageColor = (s) => {
    const sl = (s||"").toLowerCase();
    if (sl.includes("cliente") || sl.includes("customer")) return "lime";
    if (sl.includes("opor") || sl.includes("lead qualif")) return "cyan";
    if (sl.includes("lead")) return "blue";
    return "gray";
  };

  return (
    <div>
      <div className="page-header">
        <div className="page-eyebrow">Módulos RD</div>
        <h1 className="page-title">Leads</h1>
        <p className="page-sub">Base de leads sincronizados com filtros por status, fonte e comportamento.</p>
      </div>
      {err && <Alert type="error">{err}</Alert>}

      <div className="card">
        <div className="row">
          <ClientSelect value={clientId} onChange={setClientId} clients={clients} />
          <button className="btn btn-primary" onClick={load} disabled={!clientId||loading}>
            {loading ? <><Spinner/>Carregando...</> : "Carregar leads"}
          </button>
        </div>
      </div>

      {allItems.length > 0 && (
        <div className="card">
          {/* FILTROS */}
          <div style={{marginBottom:16}}>
            <div style={{display:"flex",gap:16,flexWrap:"wrap",alignItems:"flex-start",marginBottom:12}}>
              <div style={{flex:1,minWidth:200}}>
                <input
                  value={search}
                  onChange={e=>setSearch(e.target.value)}
                  placeholder="🔍 Buscar por nome ou email..."
                  style={{maxWidth:"100%"}}
                />
              </div>
              <div className="row">
                <button className="btn btn-cyan btn-sm" onClick={analyzeLeads} disabled={aiLoading}>
                  {aiLoading ? <Spinner/> : icons.ai}
                  {aiLoading ? "Analisando..." : "Analisar base com IA"}
                </button>
              </div>
            </div>

            <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
              <div>
                <div style={{fontSize:10,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Estágio</div>
                <div className="filter-bar">
                  <FilterChip label="Todos" active={filterStage==="all"} onClick={()=>setFilterStage("all")} />
                  {stages.slice(0,6).map(s => <FilterChip key={s} label={s} active={filterStage===s} onClick={()=>setFilterStage(filterStage===s?"all":s)} />)}
                </div>
              </div>
              <div>
                <div style={{fontSize:10,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Origem</div>
                <div className="filter-bar">
                  <FilterChip label="Todas" active={filterSource==="all"} onClick={()=>setFilterSource("all")} />
                  {sources.slice(0,5).map(s => <FilterChip key={s} label={s} active={filterSource===s} onClick={()=>setFilterSource(filterSource===s?"all":s)} />)}
                </div>
              </div>
            </div>
          </div>

          <div className="row-between" style={{marginBottom:12}}>
            <span style={{fontSize:13,color:"var(--text-3)"}}>{filteredItems.length} de {allItems.length} leads</span>
          </div>

          <div className="scroll-list">
            {filteredItems.slice(0,100).map((item, i) => {
              const p = item?.payload || {};
              const email = p.email || p.personal_email || "—";
              const name = p.name || email.split("@")[0];
              const stage = p.lifecycle_stage || p.stage || "indefinido";
              const source = p.traffic_source || p.utm_source || "orgânico";
              const convs = p.conversions || p.conversion_count || 0;
              return (
                <div key={i} className="module-item">
                  <div className="module-item-icon" style={{background:"var(--cyan-dim)",color:"var(--cyan)",fontFamily:"Syne",fontWeight:700,fontSize:11}}>
                    {(name[0]||"?").toUpperCase()}
                  </div>
                  <div className="module-item-info">
                    <div className="module-item-name">{name}</div>
                    <div className="module-item-meta">{email}</div>
                  </div>
                  <div style={{display:"flex",gap:6,alignItems:"center",flexShrink:0}}>
                    <span className={`badge ${stageColor(stage)}`}>{stage}</span>
                    {source !== "orgânico" && <span className="badge gray">{source}</span>}
                    {convs > 0 && <span className="badge amber">{convs} conv.</span>}
                  </div>
                </div>
              );
            })}
            {filteredItems.length === 0 && <div className="empty"><div className="empty-title">Nenhum lead encontrado</div><p>Tente ajustar os filtros.</p></div>}
          </div>
        </div>
      )}

      {aiAnalysis && (
        <div className="card">
          <div className="card-title">Análise IA da Base</div>
          <div className="two-col">
            {aiAnalysis.overview && (
              <div style={{padding:16,background:`var(--${aiAnalysis.overview.health==="saudavel"?"lime":aiAnalysis.overview.health==="atencao"?"amber":"rose"}-dim)`,borderRadius:"var(--r)",border:`1px solid rgba(${aiAnalysis.overview.health==="saudavel"?"184,245,74":aiAnalysis.overview.health==="atencao"?"245,200,74":"245,74,122"},0.2)`}}>
                <div style={{fontSize:11,fontWeight:600,color:"var(--text-3)",textTransform:"uppercase",marginBottom:8}}>Diagnóstico geral</div>
                <p style={{fontSize:13.5,color:"var(--text-2)",lineHeight:1.6}}>{aiAnalysis.overview.summary}</p>
              </div>
            )}
            <div>
              {(aiAnalysis.actions||[]).slice(0,4).map((a,i) => (
                <div key={i} style={{display:"flex",gap:10,padding:"9px 12px",background:"var(--ink)",borderRadius:8,marginBottom:6,border:"1px solid var(--line)"}}>
                  <span className={`badge ${a.when==="imediato"?"rose":a.when==="esta-semana"?"amber":"lime"}`} style={{flexShrink:0}}>{a.when}</span>
                  <span style={{fontSize:13,color:"var(--text-2)"}}>{a.action}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════
   SEGMENTAÇÕES — com botão IA por segmentação
══════════════════════════════════════════════ */
function Segmentations() {
  const [clients, setClients] = useState([]);
  const [clientId, setClientId] = useState("");
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const [analyzingId, setAnalyzingId] = useState(null);
  const [aiResults, setAiResults] = useState({});

  useEffect(() => {
    api("/api/clients/").then(res => {
      const l = Array.isArray(res)?res:[];
      setClients(l);
      if(l.length) setClientId(String(l[0].id));
    });
  }, []);

  async function load() {
    if (!clientId) return;
    setLoading(true); setErr(""); setItems([]);
    try {
      const d = await api(`/api/rd-modules/client/${clientId}/segmentations?limit=100`);
      setItems(d?.data?.items || d?.items || []);
    } catch(e) { setErr(e.message); }
    finally { setLoading(false); }
  }

  async function analyzeSeg(item, idx) {
    const p = item?.payload || {};
    const segName = p.name || `Segmentação ${idx+1}`;
    const contacts = p.contacts_count || p.contacts || 0;
    const client = clients.find(c=>String(c.id)===clientId);

    setAnalyzingId(idx);
    try {
      const d = await api("/api/leads/segment", {
        method:"POST",
        body: JSON.stringify({
          client_name: client?.name || "",
          objective: `Analisar e criar estratégia para o segmento: "${segName}" com ${contacts} contatos`,
          total_leads: contacts,
          segments: [segName],
        })
      });
      const segs = d?.segments?.segments || d?.segments;
      let result = "";

/* ══════════════════════════════════════════════
   WORKFLOWS — visualização do fluxo + IA
══════════════════════════════════════════════ */
function Workflows() {
  const [clients, setClients] = useState([]);
  const [clientId, setClientId] = useState("");
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const [expandedId, setExpandedId] = useState(null);
  const [analyzingId, setAnalyzingId] = useState(null);
  const [aiResults, setAiResults] = useState({});

  useEffect(() => {
    api("/api/clients/").then(res => {
      const l = Array.isArray(res)?res:[];
      setClients(l);
      if(l.length) setClientId(String(l[0].id));
    });
  }, []);

  async function load() {
    if (!clientId) return;
    setLoading(true); setErr(""); setItems([]);
    try {
      const d = await api(`/api/rd-modules/client/${clientId}/workflows?limit=100`);
      setItems(d?.data?.items || d?.items || []);
    } catch(e) { setErr(e.message); }
    finally { setLoading(false); }
  }

  async function analyzeWorkflow(item, idx) {
    const p = item?.payload || {};
    const wfName = p.name || `Workflow ${idx+1}`;
    const client = clients.find(c=>String(c.id)===clientId);
    setAnalyzingId(idx);
    try {
      const d = await api("/api/flows-advanced/generate-flow", {
        method:"POST",
        body: JSON.stringify({
          flow_days: 14,
          email_count: 4,
          flow_type: "otimizacao",
          goal: `Otimizar e melhorar o workflow existente: "${wfName}" (status: ${p.status||"?"})`,
          product: "",
          audience: "leads da base",
          awareness: "já conhecem a empresa",
          client_name: client?.name || "",
          client_segment: client?.segment || "",
          client_description: client?.description || "",
        })
      });
      const flow = d?.flow;
      let result = "";
      if (flow?.strategy_summary) {
        result = `## Diagnóstico: ${wfName}\n\n**Status atual:** ${p.status||"desconhecido"}\n\n**Estratégia sugerida:** ${flow.strategy_summary}\n\n**Trigger recomendado:** ${flow.trigger||"—"}\n\n### Otimizações sugeridas\n${(flow.optimization_tips||[]).map(t=>`- ${t}`).join("\n")}\n\n### Próximos passos\n${(flow.steps||[]).slice(0,4).map(s=>`**D${s.day} — ${s.title}:** ${s.description||s.subject||""}`).join("\n\n")}`;
      } else {
        result = `Análise do workflow "${wfName}" concluída. Verifique os dados retornados.`;
      }
      setAiResults(prev => ({...prev, [idx]: result}));
    } catch(e) {
      setAiResults(prev => ({...prev, [idx]: `Erro: ${e.message}`}));
    } finally { setAnalyzingId(null); }
  }

  // Parse workflow steps from payload
  function getSteps(p) {
    const steps = p.steps || p.nodes || p.actions || [];
    if (Array.isArray(steps) && steps.length) return steps;
    // Build synthetic steps from metadata
    const synthetic = [];
    if (p.trigger || p.trigger_type) {
      synthetic.push({ type: "trigger", label: p.trigger || p.trigger_type || "Gatilho", day: 0 });
    }
    if (p.actions_count || p.emails_count) {
      for (let i = 0; i < Math.min(p.actions_count || p.emails_count || 2, 5); i++) {
        synthetic.push({ type: "email", label: `Email ${i+1}`, day: (i+1)*3 });
      }
    }
    if (synthetic.length === 0) {
      synthetic.push({ type: "trigger", label: "Entrada no fluxo", day: 0 });
      synthetic.push({ type: "email", label: "Comunicação automática", day: 3 });
      synthetic.push({ type: "end", label: "Fim do fluxo", day: null });
    }
    return synthetic;
  }

  return (
    <div>
      <div className="page-header">
        <div className="page-eyebrow">Módulos RD</div>
        <h1 className="page-title">Workflows</h1>
        <p className="page-sub">Automações configuradas no RD Station. Visualize o fluxo e otimize com IA.</p>
      </div>
      {err && <Alert type="error">{err}</Alert>}

      <div className="card">
        <div className="row">
          <ClientSelect value={clientId} onChange={setClientId} clients={clients} />
          <button className="btn btn-primary" onClick={load} disabled={!clientId||loading}>
            {loading ? <><Spinner/>Carregando...</> : "Carregar dados"}
          </button>
        </div>
      </div>

      {items.length > 0 && (
        <div>
          <div style={{fontSize:13,color:"var(--text-3)",marginBottom:12}}>
            {items.length} workflows encontrados · {items.filter(i=>{const s=(i?.payload?.status||"").toLowerCase(); return["active","enabled","ativo"].includes(s);}).length} ativos
          </div>
          {items.map((item, i) => {
            const p = item?.payload || {};
            const status = (p.status || p.state || "").toLowerCase();
            const isActive = ["active","enabled","ativo"].includes(status);
            const isExpanded = expandedId === i;
            const steps = getSteps(p);
            const aiResult = aiResults[i];
            const isAnalyzing = analyzingId === i;

            return (
              <div key={i} className="card" style={{marginBottom:12,borderColor:isActive?"rgba(184,245,74,0.15)":"var(--line)"}}>
                {/* Header */}
                <div style={{display:"flex",alignItems:"center",gap:12}}>
                  <div style={{width:40,height:40,borderRadius:12,background:isActive?"var(--lime-dim)":"var(--rose-dim)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>
                    {isActive ? "⚡" : "⏸"}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:15,fontWeight:600,color:"var(--text)",marginBottom:4}}>{p.name || `Workflow ${i+1}`}</div>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                      <span className={`badge ${isActive?"lime":"rose"}`}>{status || "desconhecido"}</span>
                      {p.trigger && <span className="badge gray">⚡ {p.trigger}</span>}
                      {(p.leads_count || p.contacts_count) > 0 && (
                        <span className="badge cyan">{(p.leads_count || p.contacts_count).toLocaleString("pt-BR")} leads</span>
                      )}
                    </div>
                  </div>
                  <div style={{display:"flex",gap:8,flexShrink:0}}>
                    <button
                      className="btn btn-ghost btn-sm"
                      onClick={() => setExpandedId(isExpanded ? null : i)}
                    >
                      {isExpanded ? "▲ Ocultar" : "▼ Ver fluxo"}
                    </button>
                    <button
                      className="btn btn-cyan btn-sm"
                      onClick={() => analyzeWorkflow(item, i)}
                      disabled={isAnalyzing}
                    >
                      {isAnalyzing ? <Spinner/> : icons.ai}
                      {isAnalyzing ? "Analisando..." : "Otimizar com IA"}
                    </button>
                  </div>
                </div>

                {/* FLOW VISUALIZATION */}
                {isExpanded && (
                  <div style={{marginTop:20}}>
                    <div style={{fontSize:11,fontWeight:600,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:12}}>Estrutura do fluxo</div>
                    <div className="flow-canvas">
                      <div className="flow-timeline">
                        {steps.map((step, si) => {
                          const type = (step.type||step.kind||"email").toLowerCase();
                          const label = step.label || step.name || step.title || step.action || "Etapa";
                          const desc = step.description || step.subject || step.body_angle || "";
                          const cta = step.cta || step.cta_text || "";
                          const day = step.day !== undefined && step.day !== null ? step.day : null;

                          return (
                            <div key={si} className="flow-step">
                              {day !== null ? (
                                <div className="flow-day-badge">D{day}</div>
                              ) : (
                                <div className="flow-day-badge" style={{background:"var(--ink-3)",color:"var(--text-3)"}}>—</div>
                              )}
                              <div className={`flow-step-dot ${type}`}>{
                                type==="trigger" ? "▶" :
                                type==="email" ? "✉" :
                                type==="wait" ? "⏱" :
                                type==="condition" ? "?" :
                                type==="action" ? "★" : "■"
                              }</div>
                              <div className="flow-step-content" style={{flex:1}}>
                                <div className="flow-step-title">{label}</div>
                                {desc && <div className="flow-step-desc">{desc}</div>}
                                {cta && (
                                  <div className="flow-step-cta">
                                    <span className="badge cyan">{cta}</span>
                                  </div>
                                )}
                              </div>
                              <span className={`badge ${type==="trigger"?"lime":type==="email"?"blue":type==="wait"?"amber":type==="condition"?"cyan":"gray"}`}>{type}</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                )}

                {/* AI RESULT */}
                {aiResult && (
                  <div style={{marginTop:16}}>
                    <AiResultBlock result={aiResult} title={`Otimização IA — ${p.name||"Workflow"}`} />
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

              <div className="card">
                <div className="card-title">Mapa do Fluxo</div>

                    {(flow.steps||[]).map((step, si) => {
                      const type = (step.type||"email").toLowerCase();
                      const tc = stepTypeColors[type] || stepTypeColors.email;
                      const isLast = si === (flow.steps||[]).length - 1;

                      return (
                        <div key={si} className="flow-step">
                          <div className="flow-day-badge">
                            {step.day !== undefined && step.day !== null ? <>D<br/>{step.day}</> : "—"}
                          </div>
                          <div className="flow-step-dot" style={{background:tc.bg,border:`2px solid ${tc.border}`,color:tc.dot}}>
                            <span style={{display:type==="condition"?"inline-block":"inline",transform:type==="condition"?"rotate(-45deg)":"none",fontSize:"8px"}}>{tc.icon}</span>
                          </div>
                          <div className="flow-step-content" style={{borderColor:tc.border}}>
                            <div style={{display:"flex",alignItems:"flex-start",gap:10,marginBottom:step.description||step.body_angle ? 6 : 0}}>
                              <div className="flow-step-title" style={{flex:1}}>{step.title}</div>
                              <span className="badge" style={{background:tc.bg,color:tc.dot,border:`1px solid ${tc.border}`,flexShrink:0}}>{type}</span>
                            </div>
                            {(step.subject) && <div style={{fontSize:12,color:"var(--text-2)",fontStyle:"italic",marginBottom:4}}>"{step.subject}"</div>}
                            {(step.description || step.body_angle) && <div className="flow-step-desc">{step.description || step.body_angle}</div>}

                          </div>
                        </div>

                </div>
              </div>

              {/* Final action */}
              {flow.final_action && (

                  <div style={{fontSize:11,fontWeight:600,color:"var(--lime)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>Ação final do fluxo</div>

                    {[["Abertura esperada", flow.success_metrics.expected_open_rate, "lime"],["Conversão esperada", flow.success_metrics.expected_conversion_rate, "cyan"],["ROI estimado", flow.success_metrics.estimated_roi, "amber"]].map(([l,v,c]) => v ? (
                      <div key={l} style={{padding:16,background:"var(--ink)",borderRadius:10,border:"1px solid var(--line)",textAlign:"center"}}>
                        <div style={{fontSize:11,color:"var(--text-3)",marginBottom:6}}>{l}</div>
                        <div style={{fontFamily:"Syne",fontSize:18,fontWeight:700,color:`var(--${c})`}}>{v}</div>
                      </div>
                    ) : null)}
                  </div>
                  {(flow.optimization_tips||[]).length > 0 && (
                    <div style={{marginTop:16}}>
                      <div style={{fontSize:11,fontWeight:600,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>Dicas de Otimização</div>
                      {flow.optimization_tips.map((tip,i) => <div key={i} style={{fontSize:13,color:"var(--text-2)",padding:"6px 0",borderBottom:"1px solid var(--line)"}}>→ {tip}</div>)}

                </div>

            </div>

            <div>

                <div className="row-between" style={{marginBottom:16}}>

                    <p style={{fontSize:13,color:"var(--text-2)"}}>{email.reasoning}</p>
                  </div>
                  <span className={`badge ${email.recommended_version==="A"?"lime":"cyan"}`}>Recomendada: Versão {email.recommended_version}</span>

                {email.subject_test_tip && (

              </div>

              {/* Version tabs */}
              <div className="pill-tabs" style={{width:"fit-content"}}>
                {[["A", email.version_a], ["B", email.version_b]].map(([v, ver]) => ver ? (

                    Versão {v} {email.recommended_version===v ? "⭐" : ""}

        </div>
      )}
    </div>
  );
}

/* ── APP ROOT ── */
function App() {
  const [section, setSection] = useState("dashboard");
  const [auth, setAuth] = useState(!!getToken());

  function logout() { clearToken(); setAuth(false); }

  if (!auth) return <LoginPage onLogin={() => setAuth(true)} />;

  const pages = {
    dashboard: <Dashboard />,
    clients: <ClientsPanel />,
    portfolio: <Portfolio />,
    landing_pages: <LandingPages />,
    leads: <Leads />,
    segmentations: <Segmentations />,
    workflows: <Workflows />,
    campaigns: <Campaigns />,
    flow_studio: <FlowStudio />,
    health_audit: <HealthAudit />,
    prospect: <Prospect />,
    report: <ExecutiveReport />,
    alerts: <AlertsPanel />,
  };

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="sidebar-inner">
          <div className="brand">
            <div className="brand-logo">
              <div className="brand-icon">RD</div>
              <span className="brand-name">RD Manager IA</span>
            </div>
            <div className="brand-sub">Plataforma para agências</div>
          </div>
          {[
            ["Visão geral", [["dashboard",icons.dashboard,"Dashboard"],["clients",icons.clients,"Clientes"],["portfolio",icons.portfolio,"Carteira"]]],
            ["Módulos RD", [["landing_pages",icons.lp,"Landing Pages"],["leads",icons.leads,"Leads"],["segmentations",icons.seg,"Segmentações"],["workflows",icons.flows,"Workflows"],["campaigns",icons.clients,"Campanhas"],["flow_studio",icons.studio,"Flow Studio IA"]]],
            ["Crescimento", [["health_audit",icons.health,"Auditoria de Saúde"],["prospect",icons.prospect,"Prospecção"],["report",icons.report,"Relatório Executivo"],["alerts",icons.alerts,"Alertas"]]],
          ].map(([group, items]) => (
            <div key={group} className="nav-section">
              <div className="nav-label">{group}</div>
              {items.map(([id, icon, label]) => (
                <button key={id} className={`nav-btn ${section===id?"active":""}`} onClick={()=>setSection(id)}>
                  {icon} {label}
                </button>
              ))}
            </div>
          ))}
        </div>
        <div className="sidebar-footer">
          <button className="logout-btn" onClick={logout}>{icons.logout} Sair da conta</button>
        </div>
      </aside>
      <main className="main">
        {pages[section] || <Dashboard />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
