services:
  - type: web
    name: rd-manager
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    clearCache: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_ENV
        value: production
      - key: DEBUG_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: rd-manager-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: INVITE_CODE
        sync: false
      - key: RD_CLIENT_ID
        sync: false
      - key: RD_CLIENT_SECRET
        sync: false
      - key: RD_CRM_CLIENT_ID
        sync: false
      - key: RD_CRM_CLIENT_SECRET
        sync: false
      - key: RD_REDIRECT_URI
        sync: false
      - key: TOKEN_EXPIRE_MINUTES
        value: "1440"

databases:
  - name: rd-manager-db
    plan: basic-256mb
    region: oregon
