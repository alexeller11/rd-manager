name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 🧪 Testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rd_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/rd_manager_test
      SECRET_KEY: test-secret-key-for-ci-only-32chars
      ADMIN_PASSWORD: admin123
      GROQ_API_KEY: fake-key-for-tests
      RD_CLIENT_ID: fake-rd-client-id
      RD_CLIENT_SECRET: fake-rd-client-secret
      RD_REDIRECT_URI: http://localhost:8000/oauth/callback
      APP_ENV: test

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependências
        run: pip install -r requirements.txt

      - name: 🧪 Rodar testes
        run: pytest app/tests/ -v --tb=short

  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install ruff
      - name: 🔍 Verificar estilo
        run: ruff check app/ --ignore E501 || true

  deploy-notify:
    name: 🚀 Notificar Deploy
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: ✅ Deploy automático via Render
        run: |
          echo "Deploy disparado automaticamente pelo Render via autoDeploy: true"
          echo "Commit: ${{ github.sha }}"
          echo "Autor: ${{ github.actor }}"
          echo "Mensagem: ${{ github.event.head_commit.message }}"
